[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "founder-terminal"
version = "0.4.0"
description = "Founder Terminal / AgentOps TUI control plane"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "The TIMMY authors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dependencies = [
    "textual>=0.85.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyee>=11.0.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",
    "qrcode>=7.4.2"
]

[project.scripts]
founder-terminal = "founder_terminal.app:main"
timmy = "founder_terminal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/founder_terminal"]
