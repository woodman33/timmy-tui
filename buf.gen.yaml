version: v2
plugins:
  - remote: buf.build/bufbuild/es:v2.9.0
    out: proto/gen/ts
    opt: target=ts
  - remote: buf.build/community/neoeinstein-prost:v0.4.0
    out: proto/gen/rust
  - remote: buf.build/protocolbuffers/go:v1.36.8
    out: proto/gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: proto/gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python:v31.1
    out: proto/gen/python
inputs:
  - directory: proto
