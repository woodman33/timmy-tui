name: secrets check

# Confirms that the deploy and payment secrets are set and work, without ever
# printing a value: every result is a one-line pass/fail annotation. Only read
# calls are made (token verify, list buckets, one sandbox lookup). GitHub masks
# secret values in logs anyway; nothing derived from a value is printed either.

on:
  push:
    branches: [ops/secrets-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Which secrets are set
        env:
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_GATEWAY: ${{ secrets.CLOUDFLARE_AI_GATEWAY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_S3_API_ENDPOINT: ${{ secrets.CLOUDFLARE_S3_API_ENDPOINT }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_WORKERS_API_KEY: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_SANDBOX_SECRET: ${{ secrets.PLAID_SANDBOX_SECRET }}
          PLAID_SECRET_SANDBOX: ${{ secrets.PLAID_SECRET_SANDBOX }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: |
          present=(); missing=()
          for name in CLOUDFLARE_ACCESS_KEY_ID CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_AI_GATEWAY CLOUDFLARE_API_TOKEN \
                      CLOUDFLARE_S3_API_ENDPOINT CLOUDFLARE_SECRET_ACCESS_KEY CLOUDFLARE_WORKERS_API_KEY \
                      PLAID_CLIENT_ID PLAID_SECRET PLAID_SANDBOX_SECRET PLAID_SECRET_SANDBOX \
                      STRIPE_SECRET_KEY STRIPE_TEST_SECRET_KEY STRIPE_API_KEY; do
            if [ -n "${!name}" ]; then present+=("$name"); else missing+=("$name"); fi
          done
          echo "::notice title=Set::${present[*]:-none}"
          echo "::notice title=Not set::${missing[*]:-none}"

      - name: Cloudflare API tokens
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OLD_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          api() { curl -sS --max-time 20 -H "Authorization: Bearer $1" "https://api.cloudflare.com/client/v4$2"; }
          verify() {
            if [ -z "$2" ]; then echo "::warning title=$1::not set"; return; fi
            out=$(api "$2" "/accounts/$ACCOUNT/tokens/verify"); kind="account-owned"
            if [ "$(jq -r .success <<<"$out" 2>/dev/null)" != true ]; then out=$(api "$2" /user/tokens/verify); kind="user"; fi
            if [ "$(jq -r .success <<<"$out" 2>/dev/null)" = true ]; then
              echo "::notice title=$1::valid $kind token, $(jq -r .result.status <<<"$out"), expires $(jq -r '.result.expires_on // "never"' <<<"$out")"
            else
              echo "::error title=$1::Cloudflare does not accept it (codes: $(jq -r '[.errors[]?.code] | join(",")' <<<"$out" 2>/dev/null))"
            fi
          }
          verify CLOUDFLARE_API_TOKEN "$TOKEN"
          verify CLOUDFLARE_WORKERS_API_KEY "$OLD_TOKEN"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then exit 0; fi
          can=(); cannot=()
          for pair in "Workers:/workers/scripts" "KV:/storage/kv/namespaces" "R2:/r2/buckets" "D1:/d1/database" "Pages:/pages/projects"; do
            if [ "$(api "$TOKEN" "/accounts/$ACCOUNT${pair#*:}" | jq -r .success 2>/dev/null)" = true ]; then can+=("${pair%%:*}"); else cannot+=("${pair%%:*}"); fi
          done
          echo "::notice title=CLOUDFLARE_API_TOKEN reach::can read ${can[*]:-nothing}; cannot read ${cannot[*]:-none}"

      - name: R2 keys (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          ENDPOINT: ${{ secrets.CLOUDFLARE_S3_API_ENDPOINT }}
        run: |
          set +e
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$ENDPOINT" ]; then
            echo "::warning title=R2 keys::the access key, secret and endpoint are not all set"; exit 0
          fi
          count=$(aws s3api list-buckets --endpoint-url "$ENDPOINT" --region auto --query 'length(Buckets)' --output text 2>err.txt)
          if [ $? -eq 0 ]; then
            echo "::notice title=R2 keys::accepted; $count bucket(s) visible"
          else
            echo "::error title=R2 keys::rejected ($(grep -oE 'An error occurred \([A-Za-z]+\)|Could not connect|Invalid endpoint' err.txt | head -1))"
          fi
          rm -f err.txt

      - name: Plaid sandbox keys
        env:
          CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          SECRET: ${{ secrets.PLAID_SANDBOX_SECRET || secrets.PLAID_SECRET_SANDBOX || secrets.PLAID_SECRET }}
        run: |
          set +e
          if [ -z "$CLIENT_ID" ] || [ -z "$SECRET" ]; then
            echo "::warning title=Plaid::no client id and sandbox secret under the names this check knows"; exit 0
          fi
          code=$(curl -sS --max-time 20 -o out.json -w '%{http_code}' https://sandbox.plaid.com/institutions/get \
            -H 'Content-Type: application/json' -H "PLAID-CLIENT-ID: $CLIENT_ID" -H "PLAID-SECRET: $SECRET" \
            -d '{"count":1,"offset":0,"country_codes":["US"]}')
          if [ "$code" = 200 ]; then echo "::notice title=Plaid sandbox::keys accepted"
          else echo "::error title=Plaid sandbox::HTTP $code ($(jq -r '.error_code // "no error code"' out.json 2>/dev/null))"; fi
          rm -f out.json

      - name: Stripe key mode
        env:
          KEY: ${{ secrets.STRIPE_SECRET_KEY || secrets.STRIPE_TEST_SECRET_KEY || secrets.STRIPE_API_KEY }}
        run: |
          case "$KEY" in
            sk_test_*|rk_test_*) echo "::notice title=Stripe::a test-mode key is set" ;;
            sk_live_*|rk_live_*) echo "::warning title=Stripe::a LIVE-mode key is set" ;;
            "") echo "::notice title=Stripe::no Stripe key under the names this check knows" ;;
            *) echo "::warning title=Stripe::a key is set but it is not a secret or restricted key" ;;
          esac
