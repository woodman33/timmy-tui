name: CI

on:
  push:
    branches: [ main, master, feature/hermes-gateway-mvp ]
  pull_request:
    branches: [ main, master, feature/hermes-gateway-mvp ]
  # release.yml calls this exact gate before it publishes, so a tag never ships on a
  # weaker test run than a pull request gets.
  workflow_call:

env:
  # Known-WIP tests (ORDER privacy-d5n9 step 2, 2026-09-11). Named here and nowhere else:
  # the gate step excludes exactly this list, the "known-WIP" step runs it non-blocking so
  # the failures stay visible, and the merge-train runner reads this variable — a failing
  # test NOT named here stops the train. Delete a line when its cause is fixed.
  #
  #   tests/vision-templates.test.ts       missing public implementation and consumer; requires scoped source recovery and privacy review
  KNOWN_WIP_TESTS: >-
    tests/vision-templates.test.ts

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # setup-node's own `cache: npm` only saves on a green job (post-if: success()), so a
      # long-red gate never populated it ("npm cache is not found" on every run). Restore
      # here, save right after install — before anything that can fail.
      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'workers/ai-proxy/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node24-

      - name: Install Dependencies
        run: npm ci

      - name: Install worker dependencies (workers/ai-proxy — @cloudflare/codemode)
        working-directory: workers/ai-proxy
        run: npm ci

      - name: Save npm cache
        if: steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Install ffmpeg, fonts and tmux (film and keyboard E2E)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core tmux

      - name: Install agg 1.9.0 (demo film, checksum pinned)
        shell: bash
        run: |
          set -euo pipefail
          # Official x86_64 Linux release; verify before executing or adding to PATH.
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu \
            --output "$RUNNER_TEMP/timmy-agg-download"
          printf '%s  %s\n' f111e315cd71056b116302342553dd765b7297579ed511f111d0cedb442aeda6 \
            "$RUNNER_TEMP/timmy-agg-download" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/timmy-ci-tools"
          install -m 755 "$RUNNER_TEMP/timmy-agg-download" "$RUNNER_TEMP/timmy-ci-tools/agg"
          test "$("$RUNNER_TEMP/timmy-ci-tools/agg" --version)" = 'agg 1.9.0'
          echo "$RUNNER_TEMP/timmy-ci-tools" >> "$GITHUB_PATH"

      - name: Install OpenTimelineIO 0.18.1 (otioconvert, pinned)
        run: python3 -m pip install --user opentimelineio==0.18.1 && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install cue v0.17.1 (Command Post CUE gate)
        run: |
          curl -sSL -o /tmp/cue.tar.gz https://github.com/cue-lang/cue/releases/download/v0.17.1/cue_v0.17.1_linux_amd64.tar.gz
          sudo tar -xzf /tmp/cue.tar.gz -C /usr/local/bin cue
          cue version

      - name: Type gate (tsc)
        run: npx tsc --noEmit

      - name: Type gate (tsgo / TS7 native)
        run: npm run typecheck:native

      - name: Test gate (vitest, everything except the named known-WIP)
        run: |
          args=""
          for t in $KNOWN_WIP_TESTS; do args="$args --exclude $t"; done
          echo "excluding: $KNOWN_WIP_TESTS"
          npx vitest run $args

      # Node unit/HTTP routing coverage with Cloudflare runtime boundaries mocked.
      # This does not establish native workerd or deployed-worker qualification.
      - name: Test gate (workers/ai-proxy core and HTTP routes)
        working-directory: workers/ai-proxy
        run: npx vitest run

      - name: Test gate (isolated ShellV2 keyboard in a real PTY)
        env:
          TIMMY_PTY_TESTS: '1'
        run: npx vitest run tests/keyboard-contract.pty.test.ts

      - name: Known-WIP tests (named above; visible, non-blocking)
        continue-on-error: true
        run: npx vitest run $KNOWN_WIP_TESTS
