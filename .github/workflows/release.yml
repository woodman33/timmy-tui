name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Distribution is limited to a scoped release candidate. The guard checks
      # exact tag/manifest/lock identity, clean source, and merged-main ancestry.
      # Passing it does not replace package or native capability qualification.
      - name: Verify release candidate identity and source
        run: node scripts/release-preflight.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Install ffmpeg (clip runner E2E)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install OpenTimelineIO 0.18.1 (otioconvert, pinned)
        run: python3 -m pip install --user opentimelineio==0.18.1 && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compile Code
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Publish to NPM
        run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
