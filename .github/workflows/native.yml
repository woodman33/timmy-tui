name: native
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.73.0'
      - name: Install pinned CUE
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      - name: Buf lint and build
        run: |
          buf lint
          buf build -o "$RUNNER_TEMP/candidate.binpb"
      - name: Historical breaking compatibility
        run: |
          if git cat-file -e origin/main:proto/timmy/space/v1/space.proto; then
            buf breaking --against '.git#branch=origin/main'
          else
            echo 'Historical compatibility not applicable: no prior schema on origin/main.'
          fi
      - name: Detached breaking negative control
        run: python3 proto/checks/breaking_control.py
      - name: Generate and reject binding drift
        run: |
          buf generate
          git diff --exit-code -- proto/gen/ts proto/gen/rust proto/gen/go proto/gen/python
          python3 proto/checks/generated_manifest.py
      - name: Import protobuf CUE and reject drift
        run: |
          cue import proto -I proto -p spacev1 --proto_enum json -o "$RUNNER_TEMP/space_proto_gen.cue" proto/timmy/space/v1/space.proto
          cmp proto/gen/cue/space_proto_gen.cue "$RUNNER_TEMP/space_proto_gen.cue"
      - name: CUE positive and semantic negative fixtures
        run: python3 proto/checks/cue_cases.py
      - name: Additive build output ignores
        run: git check-ignore target/f1-probe crates/timmy-space-wasm/pkg/f1-probe
