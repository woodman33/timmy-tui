<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>TIMMY Mission Map</title>
<link rel="stylesheet" href="https://esm.sh/tldraw@3.15.0/tldraw.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0a0e12; }
  #ui { position: fixed; top: 8px; left: 8px; z-index: 50; display: flex; gap: 6px; flex-wrap: wrap;
    font: 12px ui-monospace, monospace; color: #c9d1d9; }
  #ui button { background: #101418; border: 1px solid #2d333b; color: #a98bff; border-radius: 6px;
    font: inherit; padding: 4px 10px; cursor: pointer; }
  #ui .stat { border: 1px solid #2d333b; border-radius: 6px; padding: 4px 10px; background: #101418; }
  .tldraw__editor { height: 100%; }
</style>
</head>
<body>
<div id="ui">
  <span class="stat">TIMMY Mission Map · plans compile into DispatchPlan controller</span>
  <button id="sync">sync plans</button>
  <button id="capsule">+ Task Capsule</button>
  <button id="gate">+ Gate</button>
  <button id="receipt">+ Receipt node</button>
</div>
<div id="root" style="height:100%"></div>
<script type="module">
import { Tldraw, createShapeId, DefaultTheme } from "https://esm.sh/tldraw@3.15.0";

const COMPANION = "http://localhost:4310";
const COLORS = { ready: "#8b949e", armed: "#f5b540", running: "#a98bff", judging: "#4aa8ff",
  passed: "#3fb950", failed: "#f87171", needs_approval: "#f5b540", archived: "#5a6470" };

let editor = null;
const root = document.getElementById("root");
root.innerHTML = "";

// mount tldraw (full control: dark theme, custom handlers)
import("https://esm.sh/tldraw@3.15.0").then(async (mod) => {
  const { Tldraw } = mod;
  const React = (await import("https://esm.sh/react@18.3.1")).default;
  const ReactDOM = await import("https://esm.sh/react-dom@18.3.1/client");
  ReactDOM.createRoot(root).render(React.createElement(Tldraw, {
    forceDarkMode: true,
    onMount: (ed) => { editor = ed; syncPlans(); }
  }));
});

async function syncPlans() {
  if (!editor) return setTimeout(syncPlans, 1000);
  let plans = [];
  try { plans = await (await fetch(COMPANION + "/dispatch")).json(); } catch { /* companion down */ }
  editor.selectAll(); editor.deleteShapes(editor.getSelectedShapeIds());
  plans.forEach((p, i) => {
    const id = createShapeId();
    editor.createShape({
      id, type: "note", x: 80 + (i % 3) * 320, y: 80 + Math.floor(i / 3) * 260,
      props: { text: `${p.id}\n${p.lifecycle}\n${p.harness}\nhash ${(p.plan_hash || "").slice(0, 10)}…`,
        color: COLORS[p.lifecycle] ?? "grey", size: "m" }
    });
  });
}

document.getElementById("sync").onclick = syncPlans;
const addNode = (label, color) => {
  if (!editor) return;
  const id = createShapeId();
  editor.createShape({ id, type: "note",
    x: (editor.getViewportPageBounds().centerX ?? 400) - 100, y: 420,
    props: { text: label, color, size: "m" } });
};
document.getElementById("capsule").onclick = () => addNode("Task Capsule\nobjective: …\nharness: openhands\napproval: manual", "violet");
document.getElementById("gate").onclick = () => addNode("Gate\nplan-hash token\nsingle-use · 5min", "yellow");
document.getElementById("receipt").onclick = () => addNode("Result / Receipt\nhash …\nverify ✓", "green");

setInterval(syncPlans, 5000);
</script>
<div style="position:fixed;right:12px;bottom:12px;font:11px ui-monospace,Menlo,monospace">
  <a href="http://localhost:4310/mission" target="_blank"
     style="color:#7dcfff;border:1px solid #3b4261;background:#1f2337;border-radius:6px;padding:6px 10px;text-decoration:none">
    Mission Studio · compile + playback ↗</a>
</div>
</body>
</html>
