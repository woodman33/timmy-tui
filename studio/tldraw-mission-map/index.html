<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>TIMMY Mission Map</title>
<link rel="stylesheet" href="https://esm.sh/tldraw@3.15.0/tldraw.css" />
<style>
  html, body { margin: 0; height: 100%; background: #0a0e12; }
  #ui { position: fixed; top: 8px; left: 8px; z-index: 50; display: flex; gap: 6px; flex-wrap: wrap;
    font: 12px ui-monospace, monospace; color: #c9d1d9; }
  #ui button { background: #101418; border: 1px solid #2d333b; color: #a98bff; border-radius: 6px;
    font: inherit; padding: 4px 10px; cursor: pointer; }
  #ui .stat { border: 1px solid #2d333b; border-radius: 6px; padding: 4px 10px; background: #101418; }
  .tldraw__editor { height: 100%; }
</style>
</head>
<body>
<div id="ui">
  <span class="stat">TIMMY Mission Map · plans compile into DispatchPlan controller</span>
  <button id="sync">sync plans</button>
  <button id="capsule">+ Task Capsule</button>
  <button id="gate">+ Gate</button>
  <button id="receipt">+ Receipt node</button>
  <span id="sync-status" class="stat" role="status">Plans not synchronized</span>
</div>
<div id="root" style="height:100%"></div>
<script type="module">
import { Tldraw, createShapeId, toRichText } from "https://esm.sh/tldraw@3.15.0?deps=react@18.3.1,react-dom@18.3.1";
import React from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import { createPlanSync } from './plan-sync.js';

let editor = null;
let sync = null;
const root = document.getElementById("root");
root.innerHTML = "";

createRoot(root).render(React.createElement(Tldraw, {
  onMount: (ed) => {
    editor = ed;
    ed.user.updateUserPreferences({ colorScheme: 'dark' });
    sync = createPlanSync(ed, { createShapeId, toRichText });
    syncPlans();
    setInterval(syncPlans, 5000);
  }
}));

async function syncPlans() {
  if (!sync) return;
  const result = await sync();
  if (result.state === 'pending') return;
  document.getElementById('sync-status').textContent = result.state === 'synced'
    ? `${result.count} plans received` : 'Plans unavailable — notes retained';
}

document.getElementById("sync").onclick = syncPlans;
const addNode = (label, color) => {
  if (!editor) return;
  const id = createShapeId();
  editor.createShape({ id, type: "note",
    x: (editor.getViewportPageBounds().centerX ?? 400) - 100, y: 420,
    props: { richText: toRichText(label), color, size: "m" } });
};
document.getElementById("capsule").onclick = () => addNode("Task Capsule\nobjective: add your objective\nharness: choose a harness\napproval: unconfigured", "violet");
document.getElementById("gate").onclick = () => addNode("Gate\nplan hash: add a reference\napproval: unconfigured", "yellow");
document.getElementById("receipt").onclick = () => addNode("Result / Receipt\nhash: add a reference\nverification: unknown", "grey");

</script>
<div style="position:fixed;right:12px;bottom:12px;font:11px ui-monospace,Menlo,monospace">
  <a href="http://localhost:4310/mission" target="_blank"
     style="color:#7dcfff;border:1px solid #3b4261;background:#1f2337;border-radius:6px;padding:6px 10px;text-decoration:none">
    Mission Studio · compile + playback ↗</a>
</div>
</body>
</html>
