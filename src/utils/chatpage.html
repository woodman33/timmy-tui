<!doctype html><html><head><meta charset="utf-8"><title>TIMMY /chat</title>
<style nonce="__TIMMY_NONCE__">
body{margin:0;background:#000000;color:#F2EFE9;font:14px/1.5 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;height:100vh}
header{padding:6px 12px;color:#8E8E93;border-bottom:1px solid #333333}
header b{color:#F2EFE9}
main{display:flex;flex:1;min-height:0}
#left{flex:62;overflow-y:auto;padding:12px 16px}
#right{flex:38;overflow:hidden;padding:12px;display:flex;flex-direction:column;justify-content:flex-end}
.user{color:#F2EFE9;font-weight:700;margin:10px 0 4px}
.user:before{content:"▸ "}
.assistant{margin:0 0 10px}
.assistant pre{color:#8E8E93}
.assistant a{color:#E8E4D9;text-decoration:underline}
.assistant h1,.assistant h2,.assistant h3{color:#F2EFE9}
.sealed{color:#8E8E93}.sealed b{color:#F2EFE9;font-weight:600}
.drop{margin-bottom:8px}.drop .s{color:#8E8E93}.drop .h{color:#8E8E93}.drop .m{color:#8E8E93}
#empty,.absent{color:#8E8E93;font-weight:400}
header a{color:#E8E4D9;text-decoration:underline}
a:focus-visible{outline:2px solid #FFB000;outline-offset:2px}
#timmy-token-note{margin:8px 12px;padding:8px 12px;border:1px solid #FFB000;border-radius:6px;color:#F2EFE9}
</style></head><body>
<header><b>PROMPT</b> ─ PLAN ─ LANES ─ RECEIPTS ─ PROOF · mirror of the TUI counterflow chat · full inspection at <a data-timmy-page="/">/</a></header>
<p id="timmy-token-note" role="alert" hidden></p>
<main><div id="left"><h1 id="empty">no conversation yet — type a mission in the TUI</h1></div><div id="right"></div></main>
<!-- R4 (H84): the page's token (from its fragment, kept in memory) and its requests with it: its own token script.

     (/web/island/logs-chat.js: React and Streamdown 2.5.0, bundled on this computer); they were inline and from a public CDN. The
     page runs under script-src 'self'; its style block carries the answer's nonce. -->
<script src="/chat/page.js"></script>
<script type="module" src="/web/island/logs-chat.js"></script>
</body></html>
