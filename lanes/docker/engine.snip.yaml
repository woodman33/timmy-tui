        Links:
          type: array
          description: 'A list of links for the container in the form `container_name:alias`.

            '
          items:
            type: string
        OomScoreAdj:
          type: integer
          description: 'An integer value containing the score given to the container in

            order to tune OOM killer preferences.

            '
          example: 500
        PidMode:
          type: string
          description: 'Set the PID (Process) Namespace mode for the container. It can be

            either:


            - `"container:<name|id>"`: joins another container''s PID namespace

            - `"host"`: use the host''s PID namespace inside the container

            '
        Privileged:
          type: boolean
          description: Gives the container full access to the host.
        PublishAllPorts:
          type: boolean
          description: 'Allocates an ephemeral host port for all of a container''s

            exposed ports.


            Ports are de-allocated when the container stops and allocated when

            the container starts. The allocated port might be changed when

            restarting the container.


            The port is selected from the ephemeral port range that depends on

            the kernel. For example, on Linux the range is defined by

            `/proc/sys/net/ipv4/ip_local_port_range`.

            '
        ReadonlyRootfs:
          type: boolean
          description: Mount the container's root filesystem as read only.
        SecurityOpt:
          type: array
          description: 'A list of string values to customize labels for MLS systems, such

            as SELinux.

            '
          items:
            type: string
        StorageOpt:
          type: object
          description: 'Storage driver options for this container, in the form `{"size": "120G"}`.

            '
          additionalProperties:
            type: string
        Tmpfs:
          type: object
          description: 'A map of container directories which should be replaced by tmpfs

            mounts, and their corresponding mount options. For example:


            ```

            { "/run": "rw,noexec,nosuid,size=65536k" }

            ```

            '
          additionalProperties:
            type: string
        UTSMode:
          type: string
          description: UTS namespace to use for the container.
        UsernsMode:
          type: string
          description: 'Sets the usernamespace mode for the container when usernamespace

            remapping option is enabled.

            '
        ShmSize:
          type: integer
          format: int64
          description: 'Size of `/dev/shm` in bytes. If omitted, the system uses 64MB.

            '
          minimum: 0
        Sysctls:
          type: object
          x-nullable: true
          description: 'A list of kernel parameters (sysctls) to set in the container.


            This field is omitted if not set.'
          additionalProperties:
            type: string
          example:
            net.ipv4.ip_forward: '1'
        Runtime:
          type: string
          x-nullable: true
          description: Runtime to use with this container.
        Isolation:
          type: string
          description: 'Isolation technology of the container. (Windows only)

            '
          enum:
          - default
          - process
          - hyperv
          - ''
        MaskedPaths:
          type: array
          description: 'The list of paths to be masked inside the container (this overrides

            the default set of paths).

            '
          items:
            type: string
          example:
          - /proc/asound
          - /proc/acpi
          - /proc/kcore
          - /proc/keys
          - /proc/latency_stats
          - /proc/timer_list
          - /proc/timer_stats
          - /proc/sched_debug
          - /proc/scsi
          - /sys/firmware
          - /sys/devices/virtual/powercap
        ReadonlyPaths:
          type: array
          description: 'The list of paths to be set as read-only inside the container

            (this overrides the default set of paths).

            '
          items:
            type: string
          example:
          - /proc/bus
          - /proc/fs
          - /proc/irq
          - /proc/sys
          - /proc/sysrq-trigger
  IDResponse:
    description: Response to an API call that returns just an Id
