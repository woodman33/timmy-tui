            Name: 127.0.0.1:5000
            Mirrors: []
            Secure: false
            Official: false
          '[2001:db8:a0b:12f0::1]:80':
            Name: '[2001:db8:a0b:12f0::1]:80'
            Mirrors: []
            Secure: false
            Official: false
          docker.io:
