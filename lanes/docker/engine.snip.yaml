          - `npipe` Mounts a named pipe from the host into the container. The `Source` must exist prior
          to creating the container.

          - `tmpfs` Create a tmpfs with the given options. The mount `Source` cannot be specified for
          tmpfs.

          - `volume` Creates a volume with the given name and options (or uses a pre-existing volume with
