        example: []
      OnBuild:
        description: '`ONBUILD` metadata that were defined in the image''s `Dockerfile`.

          '
        type: array
        x-nullable: true
        items:
          type: string
        example: []
      Labels:
        description: User-defined key/value metadata.
        type: object
        additionalProperties:
          type: string
        example:
