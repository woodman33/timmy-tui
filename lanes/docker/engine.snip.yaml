swagger: '2.0'
info:
  title: Docker Engine API (Timmy curated snip)
  version: '1.54'
  description: 'Curated by lanes/docker/snip.py for the Timmy Docker lane: containers, images, exec, system.
    Source: docs.docker.com Engine API.'
basePath: /v1.54
schemes:
- http
- https
paths:
  /containers/json:
    get:
      summary: List containers
      description: 'Returns a list of containers. For details on the format, see the

        [inspect endpoint](#operation/ContainerInspect).


        Note that it uses a different, smaller representation of a container

        than inspecting a single container. For example, the list of linked

        containers is not propagated .

        '
      operationId: ContainerList
      produces:
      - application/json
      parameters:
      - name: all
        in: query
        description: 'Return all containers. By default, only running containers are shown.

          '
        type: boolean
        default: false
      - name: limit
        in: query
        description: 'Return this number of most recently created containers, including

          non-running ones.

          '
        type: integer
      - name: size
        in: query
        description: 'Return the size of container as fields `SizeRw` and `SizeRootFs`.

          '
        type: boolean
        default: false
      - name: filters
        in: query
        description: 'Filters to process on the container list, encoded as JSON (a

          `map[string][]string`). For example, `{"status": ["paused"]}` will

          only return paused containers.


          Available filters:


          - `ancestor`=(`<image-name>[:<tag>]`, `<image id>`, or `<image@digest>`)

          - `before`=(`<container id>` or `<container name>`)

          - `expose`=(`<port>[/<proto>]`|`<startport-endport>/[<proto>]`)

          - `exited=<int>` containers with exit code of `<int>`

          - `health`=(`starting`|`healthy`|`unhealthy`|`none`)

          - `id=<ID>` a container''s ID

          - `isolation=`(`default`|`process`|`hyperv`) (Windows daemon only)

          - `is-task=`(`true`|`false`)

          - `label=key` or `label="key=value"` of a container label

          - `name=<name>` a container''s name

          - `network`=(`<network id>` or `<network name>`)

          - `publish`=(`<port>[/<proto>]`|`<startport-endport>/[<proto>]`)

          - `since`=(`<container id>` or `<container name>`)

          - `status=`(`created`|`restarting`|`running`|`removing`|`paused`|`exited`|`dead`)

          - `volume`=(`<volume name>` or `<mount point destination>`)

          '
        type: string
      responses:
        200:
          description: no error
          schema:
            type: array
            items:
              $ref: '#/definitions/ContainerSummary'
        400:
          description: bad parameter
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      tags:
      - Container
  /containers/create:
    post:
      summary: Create a container
      operationId: ContainerCreate
      consumes:
      - application/json
      - application/octet-stream
      produces:
      - application/json
      parameters:
      - name: name
        in: query
        description: 'Assign the specified name to the container. Must match

          `/?[a-zA-Z0-9][a-zA-Z0-9_.-]+`.

          '
        type: string
        pattern: ^/?[a-zA-Z0-9][a-zA-Z0-9_.-]+$
      - name: platform
        in: query
        description: "Platform in the format `os[/arch[/variant]]` used for image lookup.\n\nWhen specified,\
          \ the daemon checks if the requested image is present\nin the local image cache with the given\
          \ OS and Architecture, and\notherwise returns a `404` status.\n\nIf the option is not set, the\
          \ host's native OS and Architecture are\nused to look up the image in the image cache. However,\
          \ if no platform\nis passed and the given image does exist in the local image cache,\nbut its\
          \ OS or architecture does not match, the container is created\nwith the available image, and\
          \ a warning is added to the `Warnings`\nfield in the response, for example;\n\n    WARNING:\
          \ The requested image's platform (linux/arm64/v8) does not\n             match the detected\
          \ host platform (linux/amd64) and no\n             specific platform was requested\n"
        type: string
        default: ''
      - name: body
        in: body
        description: Container to create
        schema:
          allOf:
          - $ref: '#/definitions/ContainerConfig'
          - type: object
            properties:
              HostConfig:
                $ref: '#/definitions/HostConfig'
              NetworkingConfig:
                $ref: '#/definitions/NetworkingConfig'
          example:
            Hostname: ''
            Domainname: ''
            User: ''
            AttachStdin: false
            AttachStdout: true
            AttachStderr: true
            Tty: false
            OpenStdin: false
            StdinOnce: false
            Env:
            - FOO=bar
            - BAZ=quux
            Cmd:
            - date
            Entrypoint: ''
            Image: ubuntu
            Labels:
              com.example.vendor: Acme
              com.example.license: GPL
              com.example.version: '1.0'
            Volumes:
              /volumes/data: {}
            WorkingDir: ''
            NetworkDisabled: false
            ExposedPorts:
              22/tcp: {}
            StopSignal: SIGTERM
            StopTimeout: 10
            HostConfig:
              Binds:
              - /tmp:/tmp
              Links:
              - redis3:redis
              Memory: 0
              MemorySwap: 0
              MemoryReservation: 0
              NanoCpus: 500000
              CpuPercent: 80
              CpuShares: 512
              CpuPeriod: 100000
              CpuRealtimePeriod: 1000000
              CpuRealtimeRuntime: 10000
              CpuQuota: 50000
              CpusetCpus: 0,1
              CpusetMems: 0,1
              MaximumIOps: 0
              MaximumIOBps: 0
              BlkioWeight: 300
              BlkioWeightDevice:
              - {}
              BlkioDeviceReadBps:
              - {}
              BlkioDeviceReadIOps:
              - {}
              BlkioDeviceWriteBps:
              - {}
              BlkioDeviceWriteIOps:
              - {}
              DeviceRequests:
              - Driver: nvidia
                Count: -1
                DeviceIDs":
                - '0'
                - '1'
                - GPU-fef8089b-4820-abfc-e83e-94318197576e
                Capabilities:
                - - gpu
                  - nvidia
                  - compute
                Options:
                  property1: string
                  property2: string
              MemorySwappiness: 60
              OomKillDisable: false
              OomScoreAdj: 500
              PidMode: ''
              PidsLimit: 0
              PortBindings:
                22/tcp:
                - HostPort: '11022'
              PublishAllPorts: false
              Privileged: false
              ReadonlyRootfs: false
              Dns:
              - 8.8.8.8
              DnsOptions:
              - ''
              DnsSearch:
              - ''
              VolumesFrom:
              - parent
              - other:ro
              CapAdd:
              - NET_ADMIN
              CapDrop:
              - MKNOD
              GroupAdd:
              - newgroup
              RestartPolicy:
                Name: ''
                MaximumRetryCount: 0
              AutoRemove: true
              NetworkMode: bridge
              Devices: []
              Ulimits:
              - {}
              LogConfig:
                Type: json-file
                Config: {}
              SecurityOpt: []
              StorageOpt: {}
              CgroupParent: ''
              VolumeDriver: ''
              ShmSize: 67108864
            NetworkingConfig:
              EndpointsConfig:
                isolated_nw:
                  IPAMConfig:
                    IPv4Address: 172.20.30.33
                    IPv6Address: 2001:db8:abcd::3033
                    LinkLocalIPs:
                    - 169.254.34.68
                    - fe80::3468
                  Links:
                  - container_1
                  - container_2
                  Aliases:
                  - server_x
                  - server_y
                database_nw: {}
        required: true
      responses:
        201:
          description: Container created successfully
          schema:
            $ref: '#/definitions/ContainerCreateResponse'
        400:
          description: bad parameter
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: no such image
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such image: c2ada9df5af8'
        409:
          description: conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      tags:
      - Container
  /containers/{id}/start:
    post:
      summary: Start a container
      operationId: ContainerStart
      responses:
        204:
          description: no error
        304:
          description: container already started
        400:
          description: bad parameter, including an invalid checkpoint ID
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: no such container
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        type: string
      - name: detachKeys
        in: query
        description: 'Override the key sequence for detaching a container. Format is a

          single character `[a-Z]` or `ctrl-<value>` where `<value>` is one

          of: `a-z`, `@`, `^`, `[`, `,` or `_`.

          '
        type: string
      tags:
      - Container
  /containers/{id}/stop:
    post:
      summary: Stop a container
      operationId: ContainerStop
      responses:
        204:
          description: no error
        304:
          description: container already stopped
        404:
          description: no such container
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        type: string
      - name: signal
        in: query
        description: 'Signal to send to the container as an integer or string (e.g. `SIGINT`).

          '
        type: string
      - name: t
        in: query
        description: Number of seconds to wait before killing the container
        type: integer
      tags:
      - Container
  /containers/{id}/wait:
    post:
      summary: Wait for a container
      description: Block until a container stops, then returns the exit code.
      operationId: ContainerWait
      produces:
      - application/json
      responses:
        200:
          description: The container has exit.
          schema:
            $ref: '#/definitions/ContainerWaitResponse'
        400:
          description: bad parameter
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: no such container
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        type: string
      - name: condition
        in: query
        description: 'Wait until a container state reaches the given condition.


          Defaults to `not-running` if omitted or empty.

          '
        type: string
        enum:
        - not-running
        - next-exit
        - removed
        default: not-running
      tags:
      - Container
  /containers/{id}/logs:
    get:
      summary: Get container logs
      description: 'Get `stdout` and `stderr` logs from a container.


        Note: This endpoint works only for containers with the `json-file` or

        `journald` logging driver.

        '
      produces:
      - application/vnd.docker.raw-stream
      - application/vnd.docker.multiplexed-stream
      operationId: ContainerLogs
      responses:
        200:
          description: 'logs returned as a stream in response body.

            For the stream format, [see the documentation for the attach endpoint](#operation/ContainerAttach).

            Note that unlike the attach endpoint, the logs endpoint does not

            upgrade the connection and does not set Content-Type.

            '
          schema:
            type: string
            format: binary
        404:
          description: no such container
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        type: string
      - name: follow
        in: query
        description: Keep connection after returning logs.
        type: boolean
        default: false
      - name: stdout
        in: query
        description: Return logs from `stdout`
        type: boolean
        default: false
      - name: stderr
        in: query
        description: Return logs from `stderr`
        type: boolean
        default: false
      - name: since
        in: query
        description: Only return logs since this time, as a UNIX timestamp
        type: integer
        default: 0
      - name: until
        in: query
        description: Only return logs before this time, as a UNIX timestamp
        type: integer
        default: 0
      - name: timestamps
        in: query
        description: Add timestamps to every log line
        type: boolean
        default: false
      - name: tail
        in: query
        description: 'Only return this number of log lines from the end of the logs.

          Specify as an integer or `all` to output all log lines.

          '
        type: string
        default: all
      tags:
      - Container
  /containers/{id}/exec:
    post:
      summary: Create an exec instance
      description: Run a command inside a running container.
      operationId: ContainerExec
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        201:
          description: no error
          schema:
            $ref: '#/definitions/IDResponse'
        404:
          description: no such container
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        409:
          description: container is paused
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: execConfig
        in: body
        description: Exec configuration
        schema:
          type: object
          title: ExecConfig
          properties:
            AttachStdin:
              type: boolean
              description: Attach to `stdin` of the exec command.
            AttachStdout:
              type: boolean
              description: Attach to `stdout` of the exec command.
            AttachStderr:
              type: boolean
              description: Attach to `stderr` of the exec command.
            ConsoleSize:
              type: array
              description: Initial console size, as an `[height, width]` array.
              x-nullable: true
              minItems: 2
              maxItems: 2
              items:
                type: integer
                minimum: 0
              example:
              - 80
              - 64
            DetachKeys:
              type: string
              description: 'Override the key sequence for detaching a container. Format is

                a single character `[a-Z]` or `ctrl-<value>` where `<value>`

                is one of: `a-z`, `@`, `^`, `[`, `,` or `_`.

                '
            Tty:
              type: boolean
              description: Allocate a pseudo-TTY.
            Env:
              description: 'A list of environment variables in the form `["VAR=value", ...]`.

                '
              type: array
              items:
                type: string
            Cmd:
              type: array
              description: Command to run, as a string or array of strings.
              items:
                type: string
            Privileged:
              type: boolean
              description: Runs the exec process with extended privileges.
              default: false
            User:
              type: string
              description: 'The user, and optionally, group to run the exec process inside

                the container. Format is one of: `user`, `user:group`, `uid`,

                or `uid:gid`.

                '
            WorkingDir:
              type: string
              description: 'The working directory for the exec process inside the container.

                '
          example:
            AttachStdin: false
            AttachStdout: true
            AttachStderr: true
            DetachKeys: ctrl-p,ctrl-q
            Tty: false
            Cmd:
            - date
            Env:
            - FOO=bar
            - BAZ=quux
        required: true
      - name: id
        in: path
        description: ID or name of container
        type: string
        required: true
      tags:
      - Exec
  /containers/{id}:
    delete:
      summary: Remove a container
      operationId: ContainerDelete
      responses:
        204:
          description: no error
        400:
          description: bad parameter
          schema:
            $ref: '#/definitions/ErrorResponse'
        404:
          description: no such container
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        409:
          description: conflict
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'You cannot remove a running container: c2ada9df5af8. Stop the

                container before attempting removal or force remove

                '
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        type: string
      - name: v
        in: query
        description: Remove anonymous volumes associated with the container.
        type: boolean
        default: false
      - name: force
        in: query
        description: If the container is running, kill it before removing it.
        type: boolean
        default: false
      - name: link
        in: query
        description: Remove the specified link associated with the container.
        type: boolean
        default: false
      tags:
      - Container
  /containers/{id}/json:
    get:
      summary: Inspect a container
      description: Return low-level information about a container.
      operationId: ContainerInspect
      produces:
      - application/json
      responses:
        200:
          description: no error
          schema:
            $ref: '#/definitions/ContainerInspectResponse'
        404:
          description: no such container
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        type: string
      - name: size
        in: query
        type: boolean
        default: false
        description: Return the size of container as fields `SizeRw` and `SizeRootFs`
      tags:
      - Container
  /containers/{id}/kill:
    post:
      summary: Kill a container
      description: 'Send a POSIX signal to a container, defaulting to killing to the

        container.

        '
      operationId: ContainerKill
      responses:
        204:
          description: no error
        404:
          description: no such container
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such container: c2ada9df5af8'
        409:
          description: container is not running
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: Container d37cde0fe4ad63c3a7252023b2f9800282894247d145cb5933ddf6e52cc03a28 is not
                running
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        description: ID or name of the container
        type: string
      - name: signal
        in: query
        description: 'Signal to send to the container as an integer or string (e.g. `SIGINT`).

          '
        type: string
        default: SIGKILL
      tags:
      - Container
  /exec/{id}/start:
    post:
      summary: Start an exec instance
      description: 'Starts a previously set up exec instance. If detach is true, this endpoint

        returns immediately after starting the command. Otherwise, it sets up an

        interactive session with the command.

        '
      operationId: ExecStart
      consumes:
      - application/json
      produces:
      - application/vnd.docker.raw-stream
      - application/vnd.docker.multiplexed-stream
      responses:
        200:
          description: No error
        404:
          description: No such exec instance
          schema:
            $ref: '#/definitions/ErrorResponse'
        409:
          description: Container is stopped or paused
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: execStartConfig
        in: body
        schema:
          type: object
          title: ExecStartConfig
          properties:
            Detach:
              type: boolean
              description: Detach from the command.
              example: false
            Tty:
              type: boolean
              description: Allocate a pseudo-TTY.
              example: true
            ConsoleSize:
              type: array
              description: Initial console size, as an `[height, width]` array.
              x-nullable: true
              minItems: 2
              maxItems: 2
              items:
                type: integer
                minimum: 0
              example:
              - 80
              - 64
      - name: id
        in: path
        description: Exec instance ID
        required: true
        type: string
      tags:
      - Exec
  /exec/{id}/json:
    get:
      summary: Inspect an exec instance
      description: Return low-level information about an exec instance.
      operationId: ExecInspect
      produces:
      - application/json
      responses:
        200:
          description: No error
          schema:
            type: object
            title: ExecInspectResponse
            properties:
              CanRemove:
                type: boolean
              DetachKeys:
                type: string
              ID:
                type: string
              Running:
                type: boolean
              ExitCode:
                type: integer
              ProcessConfig:
                $ref: '#/definitions/ProcessConfig'
              OpenStdin:
                type: boolean
              OpenStderr:
                type: boolean
              OpenStdout:
                type: boolean
              ContainerID:
                type: string
              Pid:
                type: integer
                description: The system process ID for the exec process.
          examples:
            application/json:
              CanRemove: false
              ContainerID: b53ee82b53a40c7dca428523e34f741f3abc51d9f297a14ff874bf761b995126
              DetachKeys: ''
              ExitCode: 2
              ID: f33bbfb39f5b142420f4759b2348913bd4a8d1a6d7fd56499cb41a1bb91d7b3b
              OpenStderr: true
              OpenStdin: true
              OpenStdout: true
              ProcessConfig:
                arguments:
                - -c
                - exit 2
                entrypoint: sh
                privileged: false
                tty: true
                user: '1000'
              Running: false
              Pid: 42000
        404:
          description: No such exec instance
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        description: Exec instance ID
        required: true
        type: string
      tags:
      - Exec
  /images/json:
    get:
      summary: List Images
      description: Returns a list of images on the server. Note that it uses a different, smaller representation
        of an image than inspecting a single image.
      operationId: ImageList
      produces:
      - application/json
      responses:
        200:
          description: Summary image data for the images matching the query
          schema:
            type: array
            items:
              $ref: '#/definitions/ImageSummary'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: all
        in: query
        description: Show all images. Only images from a final layer (no children) are shown by default.
        type: boolean
        default: false
      - name: filters
        in: query
        description: 'A JSON encoded value of the filters (a `map[string][]string`) to

          process on the images list.


          Available filters:


          - `before`=(`<image-name>[:<tag>]`,  `<image id>` or `<image@digest>`)

          - `dangling=true`

          - `label=key` or `label="key=value"` of an image label

          - `reference`=(`<image-name>[:<tag>]`)

          - `since`=(`<image-name>[:<tag>]`,  `<image id>` or `<image@digest>`)

          - `until=<timestamp>`

          '
        type: string
      - name: shared-size
        in: query
        description: Compute and show shared size as a `SharedSize` field on each image.
        type: boolean
        default: false
      - name: digests
        in: query
        description: Show digest information as a `RepoDigests` field on each image.
        type: boolean
        default: false
      - name: manifests
        in: query
        description: Include `Manifests` in the image summary.
        type: boolean
        default: false
      - name: identity
        in: query
        description: Include `Identity` in each manifest summary. Requires `manifests=1`.
        type: boolean
        default: false
      tags:
      - Image
  /images/create:
    post:
      summary: Create an image
      description: Pull or import an image.
      operationId: ImageCreate
      consumes:
      - text/plain
      - application/octet-stream
      produces:
      - application/json
      responses:
        200:
          description: no error
        404:
          description: repository does not exist or no read access
          schema:
            $ref: '#/definitions/ErrorResponse'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: fromImage
        in: query
        description: 'Name of the image to pull. If the name includes a tag or digest, specific behavior
          applies:


          - If only `fromImage` includes a tag, that tag is used.

          - If both `fromImage` and `tag` are provided, `tag` takes precedence.

          - If `fromImage` includes a digest, the image is pulled by digest, and `tag` is ignored.

          - If neither a tag nor digest is specified, all tags are pulled.

          '
        type: string
      - name: fromSrc
        in: query
        description: Source to import. The value may be a URL from which the image can be retrieved or
          `-` to read the image from the request body. This parameter may only be used when importing
          an image.
        type: string
      - name: repo
        in: query
        description: Repository name given to an image when it is imported. The repo may include a tag.
          This parameter may only be used when importing an image.
        type: string
      - name: tag
        in: query
        description: Tag or digest. If empty when pulling an image, this causes all tags for the given
          image to be pulled.
        type: string
      - name: message
        in: query
        description: Set commit message for imported image.
        type: string
      - name: inputImage
        in: body
        description: Image content if the value `-` has been specified in fromSrc query parameter
        schema:
          type: string
        required: false
      - name: X-Registry-Auth
        in: header
        description: 'A base64url-encoded auth configuration.


          Refer to the [authentication section](#section/Authentication) for

          details.

          '
        type: string
      - name: changes
        in: query
        description: 'Apply `Dockerfile` instructions to the image that is created,

          for example: `changes=ENV DEBUG=true`.

          Note that `ENV DEBUG=true` should be URI component encoded.


          Supported `Dockerfile` instructions:

          `CMD`|`ENTRYPOINT`|`ENV`|`EXPOSE`|`ONBUILD`|`USER`|`VOLUME`|`WORKDIR`

          '
        type: array
        items:
          type: string
      - name: platform
        in: query
        description: 'Platform in the format os[/arch[/variant]].


          When used in combination with the `fromImage` option, the daemon checks

          if the given image is present in the local image cache with the given

          OS and Architecture, and otherwise attempts to pull the image. If the

          option is not set, the host''s native OS and Architecture are used.

          If the given image does not exist in the local image cache, the daemon

          attempts to pull the image with the host''s native OS and Architecture.

          If the given image does exists in the local image cache, but its OS or

          architecture does not match, a warning is produced.


          When used with the `fromSrc` option to import an image from an archive,

          this option sets the platform information for the imported image. If

          the option is not set, the host''s native OS and Architecture are used

          for the imported image.

          '
        type: string
        default: ''
      tags:
      - Image
  /images/{name}/json:
    get:
      summary: Inspect an image
      description: Return low-level information about an image.
      operationId: ImageInspect
      produces:
      - application/json
      responses:
        200:
          description: No error
          schema:
            $ref: '#/definitions/ImageInspect'
        404:
          description: No such image
          schema:
            $ref: '#/definitions/ErrorResponse'
          examples:
            application/json:
              message: 'No such image: someimage (tag: latest)'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: name
        in: path
        description: Image name or id
        type: string
        required: true
      - name: manifests
        in: query
        description: 'Include Manifests in the image summary.


          The `manifests` and `platform` options are mutually exclusive, and

          an error is produced if both are set.'
        type: boolean
        default: false
        required: false
      - name: platform
        type: string
        in: query
        description: 'JSON-encoded OCI platform to select the platform-variant.

          If omitted, it defaults to any locally available platform,

          prioritizing the daemon''s host platform.


          If the daemon provides a multi-platform image store, this selects

          the platform-variant to show inspect. If the image is

          a single-platform image, or if the multi-platform image does not

          provide a variant matching the given platform, an error is returned.


          The `platform` and `manifests` options are mutually exclusive, and

          an error is produced if both are set.


          Example: `{"os": "linux", "architecture": "arm", "variant": "v5"}`'
      tags:
      - Image
  /version:
    get:
      summary: Get version
      description: Returns the version of Docker that is running and various information about the system
        that Docker is running on.
      operationId: SystemVersion
      produces:
      - application/json
      responses:
        200:
          description: no error
          schema:
            $ref: '#/definitions/SystemVersion'
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      tags:
      - System
  /info:
    get:
      summary: Get system information
      operationId: SystemInfo
      produces:
      - application/json
      responses:
        200:
          description: No error
          schema:
            $ref: '#/definitions/SystemInfo'
        500:
          description: Server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      tags:
      - System
  /_ping:
    get:
      summary: Ping
      description: This is a dummy endpoint you can use to test if the server is accessible.
      operationId: SystemPing
      produces:
      - text/plain
      responses:
        200:
          description: no error
          schema:
            type: string
            example: OK
          headers:
            Api-Version:
              type: string
              description: Max API Version the server supports
            Builder-Version:
              type: string
              description: 'Default version of docker image builder


                The default on Linux is version "2" (BuildKit), but the daemon

                can be configured to recommend version "1" (classic Builder).

                Windows does not yet support BuildKit for native Windows images,

                and uses "1" (classic builder) as a default.


                This value is a recommendation as advertised by the daemon, and

                it is up to the client to choose which builder to use.

                '
              default: '2'
            Docker-Experimental:
              type: boolean
              description: If the server is running with experimental mode enabled
            Swarm:
              type: string
              enum:
              - inactive
              - pending
              - error
              - locked
              - active/worker
              - active/manager
              description: 'Contains information about Swarm status of the daemon,

                and if the daemon is acting as a manager or worker node.

                '
              default: inactive
            Cache-Control:
              type: string
              default: no-cache, no-store, must-revalidate
            Pragma:
              type: string
              default: no-cache
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
          headers:
            Cache-Control:
              type: string
              default: no-cache, no-store, must-revalidate
            Pragma:
              type: string
              default: no-cache
      tags:
      - System
    head:
      summary: Ping
      description: This is a dummy endpoint you can use to test if the server is accessible.
      operationId: SystemPingHead
      produces:
      - text/plain
      responses:
        200:
          description: no error
          schema:
            type: string
            example: (empty)
          headers:
            Api-Version:
              type: string
              description: Max API Version the server supports
            Builder-Version:
              type: string
              description: Default version of docker image builder
            Docker-Experimental:
              type: boolean
              description: If the server is running with experimental mode enabled
            Swarm:
              type: string
              enum:
              - inactive
              - pending
              - error
              - locked
              - active/worker
              - active/manager
              description: 'Contains information about Swarm status of the daemon,

                and if the daemon is acting as a manager or worker node.

                '
              default: inactive
            Cache-Control:
              type: string
              default: no-cache, no-store, must-revalidate
            Pragma:
              type: string
              default: no-cache
        500:
          description: server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      tags:
      - System
definitions:
  BuildIdentity:
    description: BuildIdentity contains build reference information if image was created via build.
    type: object
    properties:
      Ref:
        description: 'Ref is the identifier for the build request. This reference can be used to

          look up the build details in BuildKit history API.'
        type: string
      CreatedAt:
        description: CreatedAt is the time when the build ran.
        type: string
        format: date-time
  ClusterInfo:
    description: 'ClusterInfo represents information about the swarm as is returned by the

      "/info" endpoint. Join-tokens are not included.

      '
    x-nullable: true
    type: object
    properties:
      ID:
        description: The ID of the swarm.
        type: string
        example: abajmipo7b4xz5ip2nrla6b11
      Version:
        $ref: '#/definitions/ObjectVersion'
      CreatedAt:
        description: 'Date and time at which the swarm was initialised in

          [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with nano-seconds.

          '
        type: string
        format: dateTime
        example: '2016-08-18T10:44:24.496525531Z'
      UpdatedAt:
        description: 'Date and time at which the swarm was last updated in

          [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with nano-seconds.

          '
        type: string
        format: dateTime
        example: '2017-08-09T07:09:37.632105588Z'
      Spec:
        $ref: '#/definitions/SwarmSpec'
      TLSInfo:
        $ref: '#/definitions/TLSInfo'
      RootRotationInProgress:
        description: 'Whether there is currently a root CA rotation in progress for the swarm

          '
        type: boolean
        example: false
      DataPathPort:
        description: 'DataPathPort specifies the data path port number for data traffic.

          Acceptable port range is 1024 to 49151.

          If no port is set or is set to 0, the default port (4789) is used.

          '
        type: integer
        format: uint32
        default: 4789
        example: 4789
      DefaultAddrPool:
        description: 'Default Address Pool specifies default subnet pools for global scope

          networks.

          '
        type: array
        items:
          type: string
          format: CIDR
          example:
          - 10.10.0.0/16
          - 20.20.0.0/16
      SubnetSize:
        description: 'SubnetSize specifies the subnet size of the networks created from the

          default subnet pool.

          '
        type: integer
        format: uint32
        maximum: 29
        default: 24
        example: 24
  Commit:
    description: 'Commit holds the Git-commit (SHA1) that a binary was built from, as

      reported in the version-string of external tools, such as `containerd`,

      or `runC`.

      '
    type: object
    properties:
      ID:
        description: Actual commit ID of external tool.
        type: string
        example: cfb82a876ecc11b5ca0977d1733adbe58599088a
  ContainerConfig:
    description: 'Configuration for a container that is portable between hosts.

      '
    type: object
    properties:
      Hostname:
        description: 'The hostname to use for the container, as a valid RFC 1123 hostname.

          '
        type: string
        example: 439f4e91bd1d
      Domainname:
        description: 'The domain name to use for the container.

          '
        type: string
      User:
        description: 'Commands run as this user inside the container. If omitted, commands

          run as the user specified in the image the container was started from.


          Can be either user-name or UID, and optional group-name or GID,

          separated by a colon (`<user-name|UID>[<:group-name|GID>]`).'
        type: string
        example: 123:456
      AttachStdin:
        description: Whether to attach to `stdin`.
        type: boolean
        default: false
      AttachStdout:
        description: Whether to attach to `stdout`.
        type: boolean
        default: true
      AttachStderr:
        description: Whether to attach to `stderr`.
        type: boolean
        default: true
      ExposedPorts:
        description: 'An object mapping ports to an empty object in the form:


          `{"<port>/<tcp|udp|sctp>": {}}`

          '
        type: object
        x-nullable: true
        additionalProperties:
          type: object
          enum:
          - {}
          default: {}
        example:
          80/tcp: {}
          443/tcp: {}
      Tty:
        description: 'Attach standard streams to a TTY, including `stdin` if it is not closed.

          '
        type: boolean
        default: false
      OpenStdin:
        description: Open `stdin`
        type: boolean
        default: false
      StdinOnce:
        description: Close `stdin` after one attached client disconnects
        type: boolean
        default: false
      Env:
        description: 'A list of environment variables to set inside the container in the

          form `["VAR=value", ...]`. A variable without `=` is removed from the

          environment, rather than to have an empty value.

          '
        type: array
        items:
          type: string
        example:
        - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      Cmd:
        description: 'Command to run specified as a string or an array of strings.

          '
        type: array
        items:
          type: string
        example:
        - /bin/sh
      Healthcheck:
        $ref: '#/definitions/HealthConfig'
      ArgsEscaped:
        description: Command is already escaped (Windows only)
        type: boolean
        default: false
        example: false
        x-nullable: true
      Image:
        description: 'The name (or reference) of the image to use when creating the container,

          or which was used when the container was created.

          '
        type: string
        example: example-image:1.0
      Volumes:
        description: 'An object mapping mount point paths inside the container to empty

          objects.

          '
        type: object
        additionalProperties:
          type: object
          enum:
          - {}
          default: {}
      WorkingDir:
        description: The working directory for commands to run in.
        type: string
        example: /public/
      Entrypoint:
        description: 'The entry point for the container as a string or an array of strings.


          If the array consists of exactly one empty string (`[""]`) then the

          entry point is reset to system default (i.e., the entry point used by

          docker when there is no `ENTRYPOINT` instruction in the `Dockerfile`).

          '
        type: array
        items:
          type: string
        example: []
      NetworkDisabled:
        description: Disable networking for the container.
        type: boolean
        x-nullable: true
      OnBuild:
        description: '`ONBUILD` metadata that were defined in the image''s `Dockerfile`.

          '
        type: array
        x-nullable: true
        items:
          type: string
        example: []
      Labels:
        description: User-defined key/value metadata.
        type: object
        additionalProperties:
          type: string
        example:
          com.example.some-label: some-value
          com.example.some-other-label: some-other-value
      StopSignal:
        description: 'Signal to stop a container as a string or unsigned integer.

          '
        type: string
        example: SIGTERM
        x-nullable: true
      StopTimeout:
        description: 'Timeout to stop a container in seconds. If omitted, the daemon-wide

          default is used.

          '
        type: integer
        x-nullable: true
      Shell:
        description: 'Shell for when `RUN`, `CMD`, and `ENTRYPOINT` uses a shell.

          '
        type: array
        x-nullable: true
        items:
          type: string
        example:
        - /bin/sh
        - -c
  ContainerCreateResponse:
    description: OK response to ContainerCreate operation
    type: object
    title: ContainerCreateResponse
    x-go-name: CreateResponse
    required:
    - Id
    - Warnings
    properties:
      Id:
        description: The ID of the created container
        type: string
        x-nullable: false
        example: ede54ee1afda366ab42f824e8a5ffd195155d853ceaec74a927f249ea270c743
      Warnings:
        description: Warnings encountered when creating the container
        type: array
        x-nullable: false
        items:
          type: string
        example: []
  ContainerInspectResponse:
    type: object
    title: ContainerInspectResponse
    x-go-name: InspectResponse
    properties:
      Id:
        description: The ID of this container as a 128-bit (64-character) hexadecimal string (32 bytes).
        type: string
        x-go-name: ID
        minLength: 64
        maxLength: 64
        pattern: ^[0-9a-fA-F]{64}$
        example: aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf
      Created:
        description: 'Date and time at which the container was created, formatted in

          [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format with nano-seconds.'
        type: string
        format: dateTime
        x-nullable: true
        example: '2025-02-17T17:43:39.64001363Z'
      Path:
        description: The path to the command being run
        type: string
        example: /bin/sh
      Args:
        description: The arguments to the command being run
        type: array
        items:
          type: string
        example:
        - -c
        - exit 9
      State:
        $ref: '#/definitions/ContainerState'
      Image:
        description: The ID (digest) of the image that this container was created from.
        type: string
        example: sha256:72297848456d5d37d1262630108ab308d3e9ec7ed1c3286a32fe09856619a782
      ResolvConfPath:
        description: 'Location of the `/etc/resolv.conf` generated for the container on the

          host.


          This file is managed through the docker daemon, and should not be

          accessed or modified by other tools.'
        type: string
        example: /var/lib/docker/containers/aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf/resolv.conf
      HostnamePath:
        description: 'Location of the `/etc/hostname` generated for the container on the

          host.


          This file is managed through the docker daemon, and should not be

          accessed or modified by other tools.'
        type: string
        example: /var/lib/docker/containers/aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf/hostname
      HostsPath:
        description: 'Location of the `/etc/hosts` generated for the container on the

          host.


          This file is managed through the docker daemon, and should not be

          accessed or modified by other tools.'
        type: string
        example: /var/lib/docker/containers/aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf/hosts
      LogPath:
        description: 'Location of the file used to buffer the container''s logs. Depending on

          the logging-driver used for the container, this field may be omitted.


          This file is managed through the docker daemon, and should not be

          accessed or modified by other tools.'
        type: string
        x-nullable: true
        example: /var/lib/docker/containers/5b7c7e2b992aa426584ce6c47452756066be0e503a08b4516a433a54d2f69e59/5b7c7e2b992aa426584ce6c47452756066be0e503a08b4516a433a54d2f69e59-json.log
      Name:
        description: 'The name associated with this container.


          For historic reasons, the name may be prefixed with a forward-slash (`/`).'
        type: string
        example: /funny_chatelet
      RestartCount:
        description: 'Number of times the container was restarted since it was created,

          or since daemon was started.'
        type: integer
        example: 0
      Driver:
        description: 'The storage-driver used for the container''s filesystem (graph-driver

          or snapshotter).'
        type: string
        example: overlayfs
      Platform:
        description: 'The platform (operating system) for which the container was created.


          This field was introduced for the experimental "LCOW" (Linux Containers

          On Windows) features, which has been removed. In most cases, this field

          is equal to the host''s operating system (`linux` or `windows`).'
        type: string
        example: linux
      ImageManifestDescriptor:
        $ref: '#/definitions/OCIDescriptor'
        description: 'OCI descriptor of the platform-specific manifest of the image

          the container was created from.


          Note: Only available if the daemon provides a multi-platform

          image store.'
      MountLabel:
        description: SELinux mount label set for the container.
        type: string
        example: ''
      ProcessLabel:
        description: SELinux process label set for the container.
        type: string
        example: ''
      AppArmorProfile:
        description: The AppArmor profile set for the container.
        type: string
        example: ''
      ExecIDs:
        description: IDs of exec instances that are running in the container.
        type: array
        items:
          type: string
        x-nullable: true
        example:
        - b35395de42bc8abd327f9dd65d913b9ba28c74d2f0734eeeae84fa1c616a0fca
        - 3fc1232e5cd20c8de182ed81178503dc6437f4e7ef12b52cc5e8de020652f1c4
      HostConfig:
        $ref: '#/definitions/HostConfig'
      GraphDriver:
        $ref: '#/definitions/DriverData'
        x-nullable: true
      Storage:
        $ref: '#/definitions/Storage'
        x-nullable: true
      SizeRw:
        description: 'The size of files that have been created or changed by this container.


          This field is omitted by default, and only set when size is requested

          in the API request.'
        type: integer
        format: int64
        x-nullable: true
        example: '122880'
      SizeRootFs:
        description: 'The total size of all files in the read-only layers from the image

          that the container uses. These layers can be shared between containers.


          This field is omitted by default, and only set when size is requested

          in the API request.'
        type: integer
        format: int64
        x-nullable: true
        example: '1653948416'
      Mounts:
        description: List of mounts used by the container.
        type: array
        items:
          $ref: '#/definitions/MountPoint'
      Config:
        $ref: '#/definitions/ContainerConfig'
      NetworkSettings:
        $ref: '#/definitions/NetworkSettings'
  ContainerState:
    description: 'ContainerState stores container''s running state. It''s part of ContainerJSONBase

      and will be returned by the "inspect" command.

      '
    type: object
    x-nullable: true
    properties:
      Status:
        description: 'String representation of the container state. Can be one of "created",

          "running", "paused", "restarting", "removing", "exited", or "dead".

          '
        type: string
        enum:
        - created
        - running
        - paused
        - restarting
        - removing
        - exited
        - dead
        example: running
      Running:
        description: 'Whether this container is running.


          Note that a running container can be _paused_. The `Running` and `Paused`

          booleans are not mutually exclusive:


          When pausing a container (on Linux), the freezer cgroup is used to suspend

          all processes in the container. Freezing the process requires the process to

          be running. As a result, paused containers are both `Running` _and_ `Paused`.


          Use the `Status` field instead to determine if a container''s state is "running".

          '
        type: boolean
        example: true
      Paused:
        description: Whether this container is paused.
        type: boolean
        example: false
      Restarting:
        description: Whether this container is restarting.
        type: boolean
        example: false
      OOMKilled:
        description: 'Whether a process within this container has been killed because it ran

          out of memory since the container was last started.

          '
        type: boolean
        example: false
      Dead:
        type: boolean
        example: false
      Pid:
        description: The process ID of this container
        type: integer
        example: 1234
      ExitCode:
        description: The last exit code of this container
        type: integer
        example: 0
      Error:
        type: string
      StartedAt:
        description: The time when this container was last started.
        type: string
        example: '2020-01-06T09:06:59.461876391Z'
      FinishedAt:
        description: The time when this container last exited.
        type: string
        example: '2020-01-06T09:07:59.461876391Z'
      Health:
        $ref: '#/definitions/Health'
  ContainerSummary:
    type: object
    properties:
      Id:
        description: The ID of this container as a 128-bit (64-character) hexadecimal string (32 bytes).
        type: string
        x-go-name: ID
        minLength: 64
        maxLength: 64
        pattern: ^[0-9a-fA-F]{64}$
        example: aa86eacfb3b3ed4cd362c1e88fc89a53908ad05fb3a4103bca3f9b28292d14bf
      Names:
        description: 'The names associated with this container. Most containers have a single

          name, but when using legacy "links", the container can have multiple

          names.


          For historic reasons, names are prefixed with a forward-slash (`/`).'
        type: array
        items:
          type: string
        example:
        - /funny_chatelet
      Image:
        description: 'The name or ID of the image used to create the container.


          This field shows the image reference as was specified when creating the container,

          which can be in its canonical form (e.g., `docker.io/library/ubuntu:latest`

          or `docker.io/library/ubuntu@sha256:72297848456d5d37d1262630108ab308d3e9ec7ed1c3286a32fe09856619a782`),

          short form (e.g., `ubuntu:latest`)), or the ID(-prefix) of the image (e.g., `72297848456d`).


          The content of this field can be updated at runtime if the image used to

          create the container is untagged, in which case the field is updated to

          contain the the image ID (digest) it was resolved to in its canonical,

          non-truncated form (e.g., `sha256:72297848456d5d37d1262630108ab308d3e9ec7ed1c3286a32fe09856619a782`).'
        type: string
        example: docker.io/library/ubuntu:latest
      ImageID:
