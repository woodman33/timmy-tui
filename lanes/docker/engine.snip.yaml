  Runtime:
    description: 'Runtime describes an [OCI compliant](https://github.com/opencontainers/runtime-spec)

      runtime.


      The runtime is invoked by the daemon via the `containerd` daemon. OCI

      runtimes act as an interface to the Linux kernel namespaces, cgroups,

      and SELinux.

      '
    type: object
    properties:
      path:
        description: 'Name and, optional, path, of the OCI executable binary.


          If the path is omitted, the daemon searches the host''s `$PATH` for the

          binary and uses the first result.

          '
        type: string
        example: /usr/local/bin/my-oci-runtime
      runtimeArgs:
        description: 'List of command-line arguments to pass to the runtime when invoked.

          '
        type: array
        x-nullable: true
        items:
          type: string
        example:
        - --debug
        - --systemd-cgroup=false
      status:
        description: 'Information specific to the runtime.


          While this API specification does not define data provided by runtimes,

          the following well-known properties may be provided by runtimes:


          `org.opencontainers.runtime-spec.features`: features structure as defined

          in the [OCI Runtime Specification](https://github.com/opencontainers/runtime-spec/blob/main/features.md),

          in a JSON string representation.


          <p><br /></p>


          > **Note**: The information returned in this field, including the

          > formatting of values and labels, should not be considered stable,

          > and may change without notice.

          '
        type: object
        x-nullable: true
        additionalProperties:
          type: string
        example:
          org.opencontainers.runtime-spec.features: '{"ociVersionMin":"1.0.0","ociVersionMax":"1.1.0","...":"..."}'
  SignatureIdentity:
    description: SignatureIdentity contains the properties of verified signatures for the image.
    type: object
    properties:
      Name:
        description: Name is a textual description summarizing the type of signature.
        type: string
      Timestamps:
        description: Timestamps contains a list of verified signed timestamps for the signature.
        type: array
        items:
          $ref: '#/definitions/SignatureTimestamp'
      KnownSigner:
        description: KnownSigner is an identifier for a special signer identity that is known to the implementation.
        $ref: '#/definitions/KnownSignerIdentity'
      DockerReference:
        description: 'DockerReference is the Docker image reference associated with the signature.

          This is an optional field only present in older hashedrecord signatures.'
        type: string
      Signer:
        description: Signer contains information about the signer certificate used to sign the image.
        $ref: '#/definitions/SignerIdentity'
      SignatureType:
        description: SignatureType is the type of signature format. E.g. "bundle-v0.3" or "hashedrecord".
        $ref: '#/definitions/SignatureType'
      Error:
        description: 'Error contains error information if signature verification failed.

          Other fields will be empty in this case.'
        type: string
      Warnings:
        description: 'Warnings contains any warnings that occurred during signature verification.

          For example, if there was no internet connectivity and cached trust roots were used.

          Warning does not indicate a failed verification but may point to configuration issues.'
        type: array
        items:
          type: string
  SignatureTimestamp:
    description: SignatureTimestamp contains information about a verified signed timestamp for an image
      signature.
    type: object
    properties:
      Type:
        $ref: '#/definitions/SignatureTimestampType'
      URI:
        type: string
      Timestamp:
        type: string
        format: date-time
  SignatureTimestampType:
    description: SignatureTimestampType is the type of timestamp used in the signature.
    type: string
    enum:
    - Tlog
    - TimestampAuthority
  SignatureType:
    description: SignatureType is the type of signature format.
    type: string
    enum:
    - bundle-v0.3
    - simplesigning-v1
  SignerIdentity:
    description: SignerIdentity contains information about the signer certificate used to sign the image.
    type: object
    properties:
      CertificateIssuer:
        type: string
        description: CertificateIssuer is the certificate issuer.
      SubjectAlternativeName:
        type: string
        description: SubjectAlternativeName is the certificate subject alternative name.
      Issuer:
        type: string
        description: 'The OIDC issuer. Should match `iss` claim of ID token or, in the case of

          a federated login like Dex it should match the issuer URL of the

          upstream issuer. The issuer is not set the extensions are invalid and

          will fail to render.'
      BuildSignerURI:
        type: string
        description: Reference to specific build instructions that are responsible for signing.
      BuildSignerDigest:
        type: string
        description: Immutable reference to the specific version of the build instructions that is responsible
          for signing.
      RunnerEnvironment:
        type: string
        description: Specifies whether the build took place in platform-hosted cloud infrastructure or
          customer/self-hosted infrastructure.
      SourceRepositoryURI:
        type: string
        description: Source repository URL that the build was based on.
      SourceRepositoryDigest:
        type: string
        description: Immutable reference to a specific version of the source code that the build was based
          upon.
      SourceRepositoryRef:
        type: string
        description: Source Repository Ref that the build run was based upon.
      SourceRepositoryIdentifier:
        type: string
        description: Immutable identifier for the source repository the workflow was based upon.
      SourceRepositoryOwnerURI:
        type: string
        description: Source repository owner URL of the owner of the source repository that the build
          was based on.
      SourceRepositoryOwnerIdentifier:
        type: string
        description: Immutable identifier for the owner of the source repository that the workflow was
          based upon.
      BuildConfigURI:
        type: string
        description: Build Config URL to the top-level/initiating build instructions.
      BuildConfigDigest:
        type: string
        description: Immutable reference to the specific version of the top-level/initiating build instructions.
      BuildTrigger:
        type: string
        description: Event or action that initiated the build.
      RunInvocationURI:
        type: string
        description: Run Invocation URL to uniquely identify the build execution.
      SourceRepositoryVisibilityAtSigning:
        type: string
        description: Source repository visibility at the time of signing the certificate.
  Storage:
    description: 'Information about the storage used by the container.

      '
    type: object
    properties:
      RootFS:
        description: 'Information about the storage used for the container''s root filesystem.

          '
        type: object
        x-nullable: true
        $ref: '#/definitions/RootFSStorage'
  SwarmInfo:
    description: 'Represents generic information about swarm.

      '
    type: object
    properties:
      NodeID:
        description: Unique identifier of for this node in the swarm.
        type: string
        default: ''
        example: k67qz4598weg5unwwffg6z1m1
      NodeAddr:
        description: 'IP address at which this node can be reached by other nodes in the

          swarm.

          '
        type: string
        default: ''
        example: 10.0.0.46
      LocalNodeState:
        $ref: '#/definitions/LocalNodeState'
      ControlAvailable:
        type: boolean
        default: false
        example: true
      Error:
        type: string
        default: ''
      RemoteManagers:
        description: 'List of ID''s and addresses of other managers in the swarm.

          '
        type: array
        default: null
        x-nullable: true
        items:
          $ref: '#/definitions/PeerNode'
        example:
        - NodeID: 71izy0goik036k48jg985xnds
          Addr: 10.0.0.158:2377
        - NodeID: 79y6h1o4gv8n120drcprv5nmc
          Addr: 10.0.0.159:2377
        - NodeID: k67qz4598weg5unwwffg6z1m1
          Addr: 10.0.0.46:2377
      Nodes:
        description: Total number of nodes in the swarm.
        type: integer
        x-nullable: true
        example: 4
      Managers:
        description: Total number of managers in the swarm.
        type: integer
        x-nullable: true
        example: 3
      Cluster:
        $ref: '#/definitions/ClusterInfo'
  SwarmSpec:
    description: User modifiable swarm configuration.
    type: object
    properties:
      Name:
        description: Name of the swarm.
        type: string
        example: default
      Labels:
        description: User-defined key/value metadata.
        type: object
        additionalProperties:
          type: string
        example:
          com.example.corp.type: production
          com.example.corp.department: engineering
      Orchestration:
        description: Orchestration configuration.
        type: object
        x-nullable: true
        properties:
          TaskHistoryRetentionLimit:
            description: 'The number of historic tasks to keep per instance or node. If

              negative, never remove completed or failed tasks.

              '
            type: integer
            format: int64
            example: 10
      Raft:
        description: Raft configuration.
        type: object
        properties:
          SnapshotInterval:
            description: The number of log entries between snapshots.
            type: integer
            format: uint64
            example: 10000
          KeepOldSnapshots:
            description: 'The number of snapshots to keep beyond the current snapshot.

              '
            type: integer
            format: uint64
          LogEntriesForSlowFollowers:
            description: 'The number of log entries to keep around to sync up slow followers

              after a snapshot is created.

              '
            type: integer
            format: uint64
            example: 500
          ElectionTick:
            description: 'The number of ticks that a follower will wait for a message from

              the leader before becoming a candidate and starting an election.

              `ElectionTick` must be greater than `HeartbeatTick`.


              A tick currently defaults to one second, so these translate

              directly to seconds currently, but this is NOT guaranteed.

              '
            type: integer
            example: 3
          HeartbeatTick:
            description: 'The number of ticks between heartbeats. Every HeartbeatTick ticks,

              the leader will send a heartbeat to the followers.


              A tick currently defaults to one second, so these translate

              directly to seconds currently, but this is NOT guaranteed.

              '
            type: integer
            example: 1
      Dispatcher:
        description: Dispatcher configuration.
        type: object
        x-nullable: true
        properties:
          HeartbeatPeriod:
            description: 'The delay for an agent to send a heartbeat to the dispatcher.

              '
            type: integer
            format: int64
            example: 5000000000
      CAConfig:
        description: CA configuration.
        type: object
        x-nullable: true
        properties:
          NodeCertExpiry:
            description: The duration node certificates are issued for.
            type: integer
            format: int64
            example: 7776000000000000
          ExternalCAs:
            description: 'Configuration for forwarding signing requests to an external

              certificate authority.

              '
            type: array
            items:
              type: object
              properties:
                Protocol:
                  description: 'Protocol for communication with the external CA (currently

                    only `cfssl` is supported).

                    '
                  type: string
                  enum:
                  - cfssl
                  default: cfssl
                URL:
                  description: 'URL where certificate signing requests should be sent.

                    '
                  type: string
                Options:
                  description: 'An object with key/value pairs that are interpreted as

                    protocol-specific options for the external CA driver.

                    '
                  type: object
                  additionalProperties:
                    type: string
                CACert:
                  description: 'The root CA certificate (in PEM format) this external CA uses

                    to issue TLS certificates (assumed to be to the current swarm

                    root CA certificate if not provided).

                    '
                  type: string
          SigningCACert:
            description: 'The desired signing CA certificate for all swarm node TLS leaf

              certificates, in PEM format.

              '
            type: string
          SigningCAKey:
            description: 'The desired signing CA key for all swarm node TLS leaf certificates,

              in PEM format.

              '
            type: string
          ForceRotate:
            description: 'An integer whose purpose is to force swarm to generate a new

              signing CA certificate and key, if none have been specified in

              `SigningCACert` and `SigningCAKey`

              '
            format: uint64
            type: integer
      EncryptionConfig:
        description: Parameters related to encryption-at-rest.
        type: object
        properties:
          AutoLockManagers:
            description: 'If set, generate a key and use it to lock data stored on the

              managers.

              '
            type: boolean
            example: false
      TaskDefaults:
        description: Defaults for creating tasks in this cluster.
        type: object
        properties:
          LogDriver:
            description: 'The log driver to use for tasks created in the orchestrator if

              unspecified by a service.


              Updating this value only affects new tasks. Existing tasks continue

              to use their previously configured log driver until recreated.

              '
            type: object
            properties:
              Name:
                description: 'The log driver to use as a default for new tasks.

                  '
                type: string
                example: json-file
              Options:
                description: 'Driver-specific options for the selected log driver, specified

                  as key/value pairs.

                  '
                type: object
                additionalProperties:
                  type: string
                example:
                  max-file: '10'
                  max-size: 100m
  SystemInfo:
    type: object
    properties:
      ID:
        description: 'Unique identifier of the daemon.


          <p><br /></p>


          > **Note**: The format of the ID itself is not part of the API, and

          > should not be considered stable.

          '
        type: string
        example: 7TRN:IPZB:QYBB:VPBQ:UMPP:KARE:6ZNR:XE6T:7EWV:PKF4:ZOJD:TPYS
      Containers:
        description: Total number of containers on the host.
        type: integer
        example: 14
      ContainersRunning:
        description: 'Number of containers with status `"running"`.

          '
        type: integer
        example: 3
      ContainersPaused:
        description: 'Number of containers with status `"paused"`.

          '
        type: integer
        example: 1
      ContainersStopped:
        description: 'Number of containers with status `"stopped"`.

          '
        type: integer
        example: 10
      Images:
        description: 'Total number of images on the host.


          Both _tagged_ and _untagged_ (dangling) images are counted.

          '
        type: integer
        example: 508
      Driver:
        description: Name of the storage driver in use.
        type: string
        example: overlay2
      DriverStatus:
        description: 'Information specific to the storage driver, provided as

          "label" / "value" pairs.


          This information is provided by the storage driver, and formatted

          in a way consistent with the output of `docker info` on the command

          line.


          <p><br /></p>


          > **Note**: The information returned in this field, including the

          > formatting of values and labels, should not be considered stable,

          > and may change without notice.

          '
        type: array
        items:
          type: array
          items:
            type: string
        example:
        - - Backing Filesystem
          - extfs
        - - Supports d_type
          - 'true'
        - - Native Overlay Diff
          - 'true'
      DockerRootDir:
        description: 'Root directory of persistent Docker state.


          Defaults to `/var/lib/docker` on Linux, and `C:\ProgramData\docker`

          on Windows.

          '
        type: string
        example: /var/lib/docker
      Plugins:
        $ref: '#/definitions/PluginsInfo'
      MemoryLimit:
        description: Indicates if the host has memory limit support enabled.
        type: boolean
        example: true
      SwapLimit:
        description: Indicates if the host has memory swap limit support enabled.
        type: boolean
        example: true
      CpuCfsPeriod:
        description: 'Indicates if CPU CFS(Completely Fair Scheduler) period is supported by

          the host.

          '
        type: boolean
        example: true
      CpuCfsQuota:
        description: 'Indicates if CPU CFS(Completely Fair Scheduler) quota is supported by

          the host.

          '
        type: boolean
        example: true
      CPUShares:
        description: 'Indicates if CPU Shares limiting is supported by the host.

          '
        type: boolean
        example: true
      CPUSet:
        description: 'Indicates if CPUsets (cpuset.cpus, cpuset.mems) are supported by the host.


          See [cpuset(7)](https://www.kernel.org/doc/Documentation/cgroup-v1/cpusets.txt)

          '
        type: boolean
        example: true
      PidsLimit:
        description: Indicates if the host kernel has PID limit support enabled.
        type: boolean
        example: true
      OomKillDisable:
        description: Indicates if OOM killer disable is supported on the host.
        type: boolean
      IPv4Forwarding:
        description: Indicates IPv4 forwarding is enabled.
        type: boolean
        example: true
      Debug:
        description: 'Indicates if the daemon is running in debug-mode / with debug-level

          logging enabled.

          '
        type: boolean
        example: true
      NFd:
        description: 'The total number of file Descriptors in use by the daemon process.


          This information is only returned if debug-mode is enabled.

          '
        type: integer
        example: 64
      NGoroutines:
        description: 'The  number of goroutines that currently exist.


          This information is only returned if debug-mode is enabled.

          '
        type: integer
        example: 174
      SystemTime:
        description: 'Current system-time in [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt)

          format with nano-seconds.

          '
        type: string
        example: '2017-08-08T20:28:29.06202363Z'
      LoggingDriver:
        description: 'The logging driver to use as a default for new containers.

          '
        type: string
      CgroupDriver:
        description: 'The driver to use for managing cgroups.

          '
        type: string
        enum:
        - cgroupfs
        - systemd
        - none
        default: cgroupfs
        example: cgroupfs
      CgroupVersion:
        description: 'The version of the cgroup.

          '
        type: string
        enum:
        - '1'
        - '2'
        default: '1'
        example: '1'
      NEventsListener:
        description: Number of event listeners subscribed.
        type: integer
        example: 30
      KernelVersion:
        description: 'Kernel version of the host.


          On Linux, this information obtained from `uname`. On Windows this

          information is queried from the <kbd>HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\</kbd>

          registry value, for example _"10.0 14393 (14393.1198.amd64fre.rs1_release_sec.170427-1353)"_.

          '
        type: string
        example: 6.8.0-31-generic
      OperatingSystem:
        description: 'Name of the host''s operating system, for example: "Ubuntu 24.04 LTS"

          or "Windows Server 2016 Datacenter"

          '
        type: string
        example: Ubuntu 24.04 LTS
      OSVersion:
        description: 'Version of the host''s operating system


          <p><br /></p>


          > **Note**: The information returned in this field, including its

          > very existence, and the formatting of values, should not be considered

          > stable, and may change without notice.

          '
        type: string
        example: '24.04'
      OSType:
        description: 'Generic type of the operating system of the host, as returned by the

          Go runtime (`GOOS`).


          Currently returned values are "linux" and "windows". A full list of

          possible values can be found in the [Go documentation](https://go.dev/doc/install/source#environment).

          '
        type: string
        example: linux
      Architecture:
        description: 'Hardware architecture of the host, as returned by the operating system.

          This is equivalent to the output of `uname -m` on Linux.


          Unlike `Arch` (from `/version`), this reports the machine''s native

          architecture, which can differ from the Go runtime architecture when

          running a binary compiled for a different architecture (for example,

          a 32-bit binary running on 64-bit hardware).

          '
        type: string
        example: x86_64
      NCPU:
        description: 'The number of logical CPUs usable by the daemon.


          The number of available CPUs is checked by querying the operating

          system when the daemon starts. Changes to operating system CPU

          allocation after the daemon is started are not reflected.

          '
        type: integer
        example: 4
      MemTotal:
        description: 'Total amount of physical memory available on the host, in bytes.

          '
        type: integer
        format: int64
        example: 2095882240
      IndexServerAddress:
        description: 'Address / URL of the index server that is used for image search,

          and as a default for user authentication for Docker Hub and Docker Cloud.

          '
        default: https://index.docker.io/v1/
        type: string
        example: https://index.docker.io/v1/
      RegistryConfig:
        $ref: '#/definitions/RegistryServiceConfig'
      GenericResources:
        $ref: '#/definitions/GenericResources'
      HttpProxy:
        description: 'HTTP-proxy configured for the daemon. This value is obtained from the

          [`HTTP_PROXY`](https://www.gnu.org/software/wget/manual/html_node/Proxies.html) environment
          variable.

          Credentials ([user info component](https://tools.ietf.org/html/rfc3986#section-3.2.1)) in the
          proxy URL

          are masked in the API response.


          Containers do not automatically inherit this configuration.

          '
        type: string
        example: http://xxxxx:xxxxx@proxy.corp.example.com:8080
      HttpsProxy:
        description: 'HTTPS-proxy configured for the daemon. This value is obtained from the

          [`HTTPS_PROXY`](https://www.gnu.org/software/wget/manual/html_node/Proxies.html) environment
          variable.

          Credentials ([user info component](https://tools.ietf.org/html/rfc3986#section-3.2.1)) in the
          proxy URL

          are masked in the API response.


          Containers do not automatically inherit this configuration.

          '
        type: string
        example: https://xxxxx:xxxxx@proxy.corp.example.com:4443
      NoProxy:
        description: 'Comma-separated list of domain extensions for which no proxy should be

          used. This value is obtained from the [`NO_PROXY`](https://www.gnu.org/software/wget/manual/html_node/Proxies.html)

          environment variable.


          Containers do not automatically inherit this configuration.

          '
        type: string
        example: '*.local, 169.254/16'
      Name:
        description: Hostname of the host.
        type: string
        example: node5.corp.example.com
      Labels:
        description: 'User-defined labels (key/value metadata) as set on the daemon.


          <p><br /></p>


          > **Note**: When part of a Swarm, nodes can both have _daemon_ labels,

          > set through the daemon configuration, and _node_ labels, set from a

          > manager node in the Swarm. Node labels are not included in this

          > field. Node labels can be retrieved using the `/nodes/(id)` endpoint

          > on a manager node in the Swarm.

          '
        type: array
        items:
          type: string
        example:
        - storage=ssd
        - production
      ExperimentalBuild:
        description: 'Indicates if experimental features are enabled on the daemon.

          '
        type: boolean
        example: true
      ServerVersion:
        description: 'Version string of the daemon.

          '
        type: string
        example: 27.0.1
      Runtimes:
        description: 'List of [OCI compliant](https://github.com/opencontainers/runtime-spec)

          runtimes configured on the daemon. Keys hold the "name" used to

          reference the runtime.


          The Docker daemon relies on an OCI compliant runtime (invoked via the

          `containerd` daemon) as its interface to the Linux kernel namespaces,

          cgroups, and SELinux.


          The default runtime is `runc`, and automatically configured. Additional

          runtimes can be configured by the user and will be listed here.

          '
        type: object
        additionalProperties:
          $ref: '#/definitions/Runtime'
        default:
          runc:
            path: runc
        example:
          runc:
            path: runc
          runc-master:
            path: /go/bin/runc
          custom:
            path: /usr/local/bin/my-oci-runtime
            runtimeArgs:
            - --debug
            - --systemd-cgroup=false
      DefaultRuntime:
        description: 'Name of the default OCI runtime that is used when starting containers.


          The default can be overridden per-container at create time.

          '
        type: string
        default: runc
        example: runc
      Swarm:
        $ref: '#/definitions/SwarmInfo'
      LiveRestoreEnabled:
        description: 'Indicates if live restore is enabled.


          If enabled, containers are kept running when the daemon is shutdown

          or upon daemon start if running containers are detected.

          '
        type: boolean
        default: false
        example: false
      Isolation:
        description: 'Represents the isolation technology to use as a default for containers.

          The supported values are platform-specific.


          If no isolation value is specified on daemon start, on Windows client,

          the default is `hyperv`, and on Windows server, the default is `process`.


          This option is currently not used on other platforms.

          '
        default: default
        type: string
        enum:
        - default
        - hyperv
        - process
        - ''
      InitBinary:
        description: 'Name and, optional, path of the `docker-init` binary.


          If the path is omitted, the daemon searches the host''s `$PATH` for the

          binary and uses the first result.

          '
        type: string
        example: docker-init
      ContainerdCommit:
        $ref: '#/definitions/Commit'
      RuncCommit:
        $ref: '#/definitions/Commit'
      InitCommit:
        $ref: '#/definitions/Commit'
      SecurityOptions:
        description: 'List of security features that are enabled on the daemon, such as

          apparmor, seccomp, SELinux, user-namespaces (userns), rootless and

          no-new-privileges.


          Additional configuration options for each security feature may

          be present, and are included as a comma-separated list of key/value

          pairs.

          '
        type: array
        items:
          type: string
        example:
        - name=apparmor
        - name=seccomp,profile=default
        - name=selinux
        - name=userns
        - name=rootless
      ProductLicense:
        description: 'Reports a summary of the product license on the daemon.


          If a commercial license has been applied to the daemon, information

          such as number of nodes, and expiration are included.

          '
        type: string
        example: Community Engine
      DefaultAddressPools:
        description: 'List of custom default address pools for local networks, which can be

          specified in the daemon.json file or dockerd option.


          Example: a Base "10.10.0.0/16" with Size 24 will define the set of 256

          10.10.[0-255].0/24 address pools.

          '
        type: array
        items:
          type: object
          properties:
            Base:
              description: The network address in CIDR format
              type: string
              example: 10.10.0.0/16
            Size:
              description: The network pool size
              type: integer
              example: '24'
      FirewallBackend:
        $ref: '#/definitions/FirewallInfo'
      DiscoveredDevices:
        description: 'List of devices discovered by device drivers.


          Each device includes information about its source driver, kind, name,

          and additional driver-specific attributes.

          '
        type: array
        items:
          $ref: '#/definitions/DeviceInfo'
      NRI:
        $ref: '#/definitions/NRIInfo'
      Warnings:
        description: 'List of warnings / informational messages about missing features, or

          issues related to the daemon configuration.


          These messages can be printed by the client as information to the user.

          '
        type: array
        items:
          type: string
        example:
        - 'WARNING: No memory limit support'
      CDISpecDirs:
        description: 'List of directories where (Container Device Interface) CDI

          specifications are located.


          These specifications define vendor-specific modifications to an OCI

          runtime specification for a container being created.


          An empty list indicates that CDI device injection is disabled.


          Note that since using CDI device injection requires the daemon to have

          experimental enabled. For non-experimental daemons an empty list will

          always be returned.

          '
        type: array
        items:
          type: string
        example:
        - /etc/cdi
        - /var/run/cdi
      Containerd:
        $ref: '#/definitions/ContainerdInfo'
  SystemVersion:
    type: object
    description: 'Response of Engine API: GET "/version"

      '
    properties:
      Platform:
        type: object
        required:
        - Name
        properties:
          Name:
            type: string
      Components:
        type: array
        description: 'Information about system components

          '
        items:
          type: object
          x-go-name: ComponentVersion
          required:
          - Name
          - Version
          properties:
            Name:
              description: 'Name of the component

                '
              type: string
              example: Engine
            Version:
              description: 'Version of the component

                '
              type: string
              x-nullable: false
              example: 27.0.1
            Details:
              description: 'Key/value pairs of strings with additional information about the

                component. These values are intended for informational purposes

                only, and their content is not defined, and not part of the API

                specification.


                These messages can be printed by the client as information to the user.

                '
              type: object
              x-nullable: true
      Version:
        description: The version of the daemon
        type: string
        example: 27.0.1
      ApiVersion:
        description: 'The default (and highest) API version that is supported by the daemon

          '
        type: string
        example: '1.47'
      MinAPIVersion:
        description: 'The minimum API version that is supported by the daemon

          '
        type: string
        example: '1.24'
      GitCommit:
        description: 'The Git commit of the source code that was used to build the daemon

          '
        type: string
        example: 48a66213fe
      GoVersion:
        description: 'The version Go used to compile the daemon, and the version of the Go

          runtime in use.

          '
        type: string
        example: go1.22.7
      Os:
        description: 'The operating system that the daemon is running on ("linux" or "windows")

          '
        type: string
        example: linux
      Arch:
        description: 'Architecture of the daemon, as returned by the Go runtime (`GOARCH`).


          A full list of possible values can be found in the [Go documentation](https://go.dev/doc/install/source#environment).

          '
        type: string
        example: amd64
      KernelVersion:
        description: 'The kernel version (`uname -r`) that the daemon is running on.


          This field is omitted when empty.

          '
        type: string
        example: 6.8.0-31-generic
      Experimental:
        description: 'Indicates if the daemon is started with experimental features enabled.


          This field is omitted when empty / false.

          '
        type: boolean
        example: true
      BuildTime:
        description: 'The date and time that the daemon was compiled.

          '
        type: string
        example: '2020-06-22T15:49:27.000000000+00:00'
