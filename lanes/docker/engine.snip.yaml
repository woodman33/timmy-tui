      Cmd:
        description: 'Command to run specified as a string or an array of strings.

          '
        type: array
        items:
          type: string
        example:
        - /bin/sh
      Healthcheck:
        $ref: '#/definitions/HealthConfig'
      ArgsEscaped:
        description: Command is already escaped (Windows only)
        type: boolean
        default: false
        example: false
