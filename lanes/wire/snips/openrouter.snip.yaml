    WebFetchEngineEnum:
      description: Which fetch engine to use. "auto" (default) uses native if the provider supports it, otherwise Exa. "native" forces the provider's built-in fetch. "exa" uses Exa Contents API. "openrouter" uses direct HTTP fetch. "firecrawl" uses Firecrawl scrape (requires BYOK). "parallel" uses the Parallel extract API.
      enum:
      - auto
      - native
      - openrouter
      - exa
      - parallel
      - firecrawl
      example: auto
      type: string
      x-speakeasy-unknown-values: allow
    WebFetchPlugin:
      example:
        id: web-fetch
        max_uses: 10
      properties:
        allowed_domains:
          description: Only fetch from these domains.
          items:
            type: string
          type: array
        blocked_domains:
          description: Never fetch from these domains.
          items:
            type: string
          type: array
        id:
          enum:
          - web-fetch
          type: string
        max_content_tokens:
          description: Maximum content length in approximate tokens. Content exceeding this limit is truncated.
          type: integer
        max_uses:
          description: Maximum number of web fetches per request. Once exceeded, the tool returns an error.
          type: integer
      required:
      - id
      type: object
    WebFetchServerTool:
      description: 'OpenRouter built-in server tool: fetches full content from a URL (web page or PDF)'
      example:
        parameters:
          max_uses: 10
        type: openrouter:web_fetch
      properties:
        parameters:
          $ref: '#/components/schemas/WebFetchServerToolConfig'
        type:
          enum:
          - openrouter:web_fetch
          type: string
      required:
      - type
      type: object
    WebFetchServerToolConfig:
      description: Configuration for the openrouter:web_fetch server tool
      example:
        max_content_tokens: 100000
        max_uses: 10
      properties:
        allowed_domains:
          description: Only fetch from these domains.
          items:
            type: string
          type: array
        blocked_domains:
          description: Never fetch from these domains.
          items:
            type: string
          type: array
        engine:
          $ref: '#/components/schemas/WebFetchEngineEnum'
        max_content_tokens:
          description: Maximum content length in approximate tokens. Content exceeding this limit is truncated.
          example: 100000
          type: integer
        max_uses:
          description: Maximum number of web fetches per request. Once exceeded, the tool returns an error.
          example: 10
          type: integer
      type: object
    WebSearchConfig:
      example:
        max_results: 5
        search_context_size: medium
      properties:
        allowed_domains:
          description: Limit search results to these domains. Supported by Exa, Firecrawl, Parallel, Perplexity, and most native providers (Anthropic, OpenAI, xAI). Cannot be used with excluded_domains.
          items:
            type: string
          type: array
        engine:
          $ref: '#/components/schemas/WebSearchEngineEnum'
        excluded_domains:
          description: Exclude search results from these domains. Supported by Exa, Firecrawl, Parallel, Perplexity, Anthropic, OpenAI, and xAI. Cannot be used with allowed_domains.
          items:
            type: string
          type: array
        max_characters:
          description: Exact maximum number of characters of content per search result. Applies to the Exa, Parallel, and Perplexity engines; ignored with native provider search and Firecrawl. For Exa, caps highlight content per result. For Parallel, caps excerpt content per result (default 1,500 when omitted). For Perplexity, maps to the native `max_tokens_per_page` parameter (converted from characters to tokens) and trims the response to the exact character cap. When both `max_characters` and `search_context_size` are set, `max_characters` takes precedence. When omitted, falls back to `search_context_size` mapping (Exa) or engine defaults (Parallel, Perplexity).
          example: 2000
          type: integer
        max_results:
          description: Maximum number of search results to return per search call. Defaults to 5. Applies to Exa, Firecrawl, Parallel, and Perplexity engines; ignored with native provider search. Perplexity supports a maximum of 20; values above 20 are clamped.
          example: 5
          type: integer
        max_total_results:
          description: Maximum total number of search results across all search calls in a single request. Once this limit is reached, the tool will stop returning new results. Useful for controlling cost and context size in agentic loops. Defaults to 50 when not specified.
          example: 50
          type: integer
        max_uses:
          description: Maximum number of web searches the model may perform in a single request. Once reached, further search calls return an error result instead of executing. Applies to the Exa, Firecrawl, Parallel, and Perplexity engines. With native provider search, forwarded only to Anthropic (as `max_uses`); other native search providers have no equivalent parameter and ignore it.
          example: 3
          type: integer
        mode:
          $ref: '#/components/schemas/WebSearchMode'
        search_context_size:
          $ref: '#/components/schemas/SearchQualityLevel'
        user_location:
          $ref: '#/components/schemas/WebSearchUserLocationServerTool'
      type: object
    WebSearchEngine:
      description: The search engine to use for web search.
      enum:
      - native
      - exa
      - firecrawl
      - parallel
      - perplexity
      example: exa
      type: string
      x-speakeasy-unknown-values: allow
    WebSearchEngineEnum:
      description: Which search engine to use. "auto" (default) uses native if the provider supports it, otherwise Exa. "native" forces the provider's built-in search. "exa" forces the Exa search API. "firecrawl" uses Firecrawl (requires BYOK). "parallel" uses the Parallel search API. "perplexity" uses the Perplexity Search API (raw ranked results).
      enum:
      - native
      - exa
      - parallel
      - firecrawl
      - perplexity
      - auto
      example: auto
      type: string
      x-speakeasy-unknown-values: allow
    WebSearchMode:
      description: Engine-native search mode. Exa supports instant, fast, auto (default), deep-lite, deep, and deep-reasoning. Parallel supports turbo, fast, basic (default), and advanced. Modes unsupported by the selected engine are ignored.
      enum:
      - instant
      - fast
      - auto
      - deep-lite
      - deep
      - deep-reasoning
      - turbo
      - basic
      - advanced
      example: auto
      type: string
      x-speakeasy-unknown-values: allow
    WebSearchPlugin:
      example:
        enabled: true
        id: web
        max_results: 5
      properties:
        enabled:
          description: Set to false to disable the web-search plugin for this request. Defaults to true.
          type: boolean
        engine:
          $ref: '#/components/schemas/WebSearchEngine'
        exclude_domains:
          description: A list of domains to exclude from web search results. Supports wildcards (e.g. "*.substack.com") and path filtering (e.g. "openai.com/blog").
          example:
          - example.com
          - '*.substack.com'
          - openai.com/blog
          items:
            type: string
          type: array
        id:
          enum:
          - web
          type: string
        include_domains:
          description: A list of domains to restrict web search results to. Supports wildcards (e.g. "*.substack.com") and path filtering (e.g. "openai.com/blog").
          example:
          - example.com
          - '*.substack.com'
          - openai.com/blog
          items:
            type: string
          type: array
        max_results:
          type: integer
        max_uses:
          description: Maximum number of times the model can invoke web search in a single turn. Passed through to native providers that support it (e.g. Anthropic).
          type: integer
        mode:
          $ref: '#/components/schemas/WebSearchMode'
        search_prompt:
          type: string
        user_location:
          allOf:
          - $ref: '#/components/schemas/WebSearchUserLocation'
          - description: Approximate user location for location-biased search results. Passed through to native providers that support it (e.g. Anthropic).
            example:
              city: San Francisco
              country: US
              region: California
              timezone: America/Los_Angeles
              type: approximate
            required:
            - type
      required:
      - id
      type: object
    WebSearchUserLocation:
      description: User location information for web search
      example:
        city: San Francisco
        country: USA
        region: California
        timezone: America/Los_Angeles
        type: approximate
      properties:
        city:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        type:
          enum:
          - approximate
          type: string
      type:
      - object
      - 'null'
    WebSearchUserLocationServerTool:
      description: Approximate user location for location-biased results.
      example:
        city: San Francisco
        country: US
        region: California
        timezone: America/Los_Angeles
        type: approximate
      properties:
        city:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        type:
          enum:
          - approximate
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: API key as bearer token in Authorization header
      scheme: bearer
      type: http
