        metadata:
          additionalProperties: {}
          type:
          - object
          - 'null'
      required:
      - code
      - message
      type: object
    BashServerTool:
      description: 'OpenRouter built-in server tool: runs shell commands server-side in a sandboxed container'
      example:
        parameters:
          environment:
            type: container_auto
        type: openrouter:bash
      properties:
        parameters:
          $ref: '#/components/schemas/BashServerToolConfig'
        type:
          enum:
          - openrouter:bash
          type: string
      required:
      - type
      type: object
    BashServerToolConfig:
      description: Configuration for the openrouter:bash server tool
      example:
        environment:
          type: container_auto
      properties:
        engine:
          $ref: '#/components/schemas/BashServerToolEngine'
        environment:
          $ref: '#/components/schemas/BashServerToolEnvironment'
        sleep_after_seconds:
          $ref: '#/components/schemas/SandboxSleepAfterSeconds'
      type: object
    BashServerToolEngine:
      description: Which bash engine to use. "openrouter" runs commands server-side in the OpenRouter sandbox. "auto" (default) and "native" use native passthrough, returning the tool call to your application to run client-side; OpenRouter does not execute the commands.
      enum:
      - auto
      - native
      - openrouter
      example: auto
      type: string
      x-speakeasy-unknown-values: allow
    BashServerToolEnvironment:
      description: Execution environment for the bash server tool.
      discriminator:
        mapping:
          container_auto: '#/components/schemas/ContainerAutoEnvironment'
          container_reference: '#/components/schemas/ContainerReferenceEnvironment'
        propertyName: type
      example:
        type: container_auto
      oneOf:
      - $ref: '#/components/schemas/ContainerAutoEnvironment'
      - $ref: '#/components/schemas/ContainerReferenceEnvironment'
    ChatAssistantImages:
      description: Generated images from image generation models
      example:
      - image_url:
          url: data:image/png;base64,iVBORw0KGgo...
      items:
        properties:
          image_url:
            properties:
              url:
                description: URL or base64-encoded data of the generated image
                type: string
            required:
            - url
            type: object
        required:
        - image_url
        type: object
      type: array
    ChatAssistantMessage:
      description: Assistant message for requests and responses
      example:
        content: The capital of France is Paris.
        model: openai/gpt-4o
        role: assistant
      properties:
        audio:
          $ref: '#/components/schemas/ChatAudioOutput'
        content:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/ChatContentItems'
            type: array
          - type: 'null'
          description: Assistant message content
        images:
          $ref: '#/components/schemas/ChatAssistantImages'
        model:
          description: Model that generated this assistant message
          example: openai/gpt-4o
          type: string
        name:
          description: Optional name for the assistant
          type: string
        reasoning:
          description: Reasoning output
          type:
          - string
          - 'null'
        reasoning_details:
          $ref: '#/components/schemas/ChatReasoningDetails'
        refusal:
          description: Refusal message if content was refused
          type:
          - string
          - 'null'
        role:
          enum:
          - assistant
          type: string
        tool_calls:
          description: Tool calls made by the assistant
          items:
            $ref: '#/components/schemas/ChatToolCall'
          type: array
      required:
      - role
      type: object
    ChatAudioOutput:
      description: Audio output data or reference
      example:
        data: UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1f
        expires_at: 1677652400
        id: audio_abc123
        transcript: Hello! How can I help you today?
      properties:
        data:
          description: Base64 encoded audio data
          type: string
        expires_at:
          description: Audio expiration timestamp
          type: integer
        id:
          description: Audio output identifier
          type: string
        transcript:
          description: Audio transcript
          type: string
      type: object
    ChatChoice:
      description: Chat completion choice
      example:
        finish_reason: stop
        index: 0
        logprobs: null
        message:
          content: The capital of France is Paris.
          role: assistant
      properties:
        finish_reason:
          $ref: '#/components/schemas/ChatFinishReasonEnum'
        index:
          description: Choice index
          example: 0
          type: integer
        logprobs:
          $ref: '#/components/schemas/ChatTokenLogprobs'
        message:
          $ref: '#/components/schemas/ChatAssistantMessage'
      required:
      - finish_reason
      - index
      - message
      type: object
    ChatContentAudio:
      description: Audio input content part. Supported audio formats vary by provider.
      example:
        input_audio:
          data: SGVsbG8gV29ybGQ=
          format: wav
        type: input_audio
      properties:
        input_audio:
          properties:
            data:
              description: Base64 encoded audio data
              type: string
            format:
              description: Audio format (e.g., wav, mp3, flac, m4a, ogg, aiff, aac, pcm16, pcm24). Supported formats vary by provider.
              type: string
          required:
          - data
          - format
          type: object
        type:
          enum:
          - input_audio
          type: string
      required:
      - type
      - input_audio
      type: object
    ChatContentCacheControl:
      allOf:
      - $ref: '#/components/schemas/AnthropicCacheControlDirective'
      - properties: {}
        type: object
      description: 'Anthropic-style cache breakpoint for the content part. Interchangeable with the OpenAI-style `prompt_cache_breakpoint` marker: OpenRouter converts between the two based on the provider serving the request.'
      example:
        ttl: 5m
        type: ephemeral
    ChatContentFile:
      description: File content part for document processing
      example:
        file:
          file_data: https://example.com/document.pdf
          filename: document.pdf
        type: file
      properties:
        file:
          properties:
            file_data:
              description: File content as base64 data URL or URL
              type: string
            file_id:
              description: File ID for previously uploaded files
              type: string
            filename:
              description: Original filename
              type: string
          type: object
        type:
          enum:
          - file
          type: string
      required:
      - type
      - file
      type: object
    ChatContentImage:
      description: Image content part for vision models
      example:
        image_url:
          detail: auto
          url: https://example.com/image.jpg
        type: image_url
      properties:
        image_url:
          properties:
            detail:
              description: Image detail level for vision models. `original` is an OpenRouter extension (not in the OpenAI Chat Completions spec) requesting true original-resolution media; it is downgraded to `high` for providers that lack an original-resolution tier.
              enum:
              - auto
              - low
              - high
              - original
              type: string
              x-speakeasy-unknown-values: allow
            url:
              description: 'URL of the image (data: URLs supported)'
              type: string
          required:
          - url
          type: object
        type:
          enum:
          - image_url
          type: string
      required:
      - type
      - image_url
      type: object
    ChatContentItems:
      description: Content part for chat completion messages
      discriminator:
        mapping:
          file: '#/components/schemas/ChatContentFile'
          image_url: '#/components/schemas/ChatContentImage'
          input_audio: '#/components/schemas/ChatContentAudio'
          input_video: '#/components/schemas/Legacy_ChatContentVideo'
          text: '#/components/schemas/ChatContentText'
          video_url: '#/components/schemas/ChatContentVideo'
        propertyName: type
      example:
        text: Hello, world!
        type: text
      oneOf:
      - $ref: '#/components/schemas/ChatContentText'
      - $ref: '#/components/schemas/ChatContentImage'
      - $ref: '#/components/schemas/ChatContentAudio'
      - $ref: '#/components/schemas/Legacy_ChatContentVideo'
      - $ref: '#/components/schemas/ChatContentVideo'
      - $ref: '#/components/schemas/ChatContentFile'
    ChatContentText:
      description: Text content part
      example:
        text: Hello, world!
        type: text
      properties:
        cache_control:
          $ref: '#/components/schemas/ChatContentCacheControl'
        prompt_cache_breakpoint:
          $ref: '#/components/schemas/PromptCacheBreakpoint'
        text:
          type: string
        type:
          enum:
          - text
          type: string
      required:
      - type
      - text
      type: object
    ChatContentVideo:
      description: Video input content part
      example:
        type: video_url
        video_url:
          url: https://example.com/video.mp4
      properties:
        type:
          enum:
          - video_url
          type: string
        video_url:
          $ref: '#/components/schemas/ChatContentVideoInput'
      required:
      - type
      - video_url
      type: object
    ChatContentVideoInput:
      description: Video input object
      example:
        url: https://example.com/video.mp4
      properties:
        processing:
          description: Video processing mode. `agentic` enables agentic video processing and `static` forces fixed-rate frame sampling on providers that support it (currently Google Gemini).
          enum:
          - agentic
          - static
          example: agentic
          type: string
          x-speakeasy-unknown-values: allow
        url:
          description: 'URL of the video (data: URLs supported)'
          type: string
      required:
      - url
      type: object
    ChatDebugOptions:
      description: Debug options for inspecting request transformations (streaming only)
      example:
        echo_upstream_body: true
      properties:
        echo_upstream_body:
          description: If true, includes the transformed upstream request body in a debug chunk at the start of the stream. Only works with streaming mode.
          example: true
          type: boolean
      type: object
    ChatDeveloperMessage:
      description: Developer message
      example:
        content: This is a message from the developer.
        role: developer
      properties:
        content:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/ChatContentText'
            type: array
          description: Developer message content
          example: This is a message from the developer.
        name:
          description: Optional name for the developer message
          example: Developer
          type: string
        role:
          enum:
          - developer
          type: string
      required:
      - role
      - content
      type: object
    ChatFinishReasonEnum:
      enum:
      - tool_calls
      - stop
      - length
      - content_filter
      - error
      - null
      example: stop
      type:
      - string
      - 'null'
      x-speakeasy-unknown-values: allow
    ChatFormatGrammarConfig:
      description: Custom grammar response format
      example:
        grammar: root ::= "yes" | "no"
        type: grammar
      properties:
        grammar:
          description: Custom grammar for text generation
          example: root ::= "yes" | "no"
          type: string
        type:
          enum:
          - grammar
          type: string
      required:
      - type
      - grammar
      type: object
    ChatFormatJsonObjectConfig:
      description: JSON object response format
      example:
        type: json_object
      properties:
        type:
          enum:
          - json_object
          type: string
      required:
      - type
      type: object
    ChatFormatJsonSchemaConfig:
      description: JSON Schema response format for structured outputs
      example:
        json_schema:
          name: math_response
          schema:
            properties:
              answer:
                type: number
            required:
            - answer
            type: object
        type: json_schema
      properties:
        json_schema:
          $ref: '#/components/schemas/ChatJsonSchemaConfig'
        type:
          enum:
          - json_schema
          type: string
      required:
      - type
      - json_schema
      type: object
    ChatFormatPythonConfig:
      description: Python code response format
      example:
        type: python
      properties:
        type:
          enum:
          - python
          type: string
      required:
      - type
      type: object
    ChatFormatTextConfig:
      description: Default text response format
      example:
        type: text
      properties:
        type:
          enum:
          - text
          type: string
      required:
      - type
      type: object
    ChatFunctionTool:
      anyOf:
      - properties:
          cache_control:
            $ref: '#/components/schemas/ChatContentCacheControl'
          function:
            description: Function definition for tool calling
            example:
              description: Get the current weather for a location
              name: get_weather
              parameters:
                properties:
                  location:
                    description: City name
                    type: string
                required:
                - location
                type: object
            properties:
              description:
                description: Function description for the model
                example: Get the current weather for a location
                type: string
              name:
                description: Function name (a-z, A-Z, 0-9, underscores, dashes, max 64 chars)
                example: get_weather
                maxLength: 64
                type: string
              parameters:
                additionalProperties: {}
                description: Function parameters as JSON Schema object
                example:
                  properties:
                    location:
                      description: City name
                      type: string
                  required:
                  - location
                  type: object
                type: object
              strict:
                description: Enable strict schema adherence
                example: false
                type:
                - boolean
                - 'null'
            required:
            - name
            type: object
          type:
            enum:
            - function
            type: string
        required:
        - type
        - function
        type: object
      - $ref: '#/components/schemas/AdvisorServerTool_OpenRouter'
      - $ref: '#/components/schemas/BashServerTool'
      - $ref: '#/components/schemas/DatetimeServerTool'
      - $ref: '#/components/schemas/FilesServerTool'
      - $ref: '#/components/schemas/FusionServerTool_OpenRouter'
      - $ref: '#/components/schemas/ImageGenerationServerTool_OpenRouter'
      - $ref: '#/components/schemas/ChatSearchModelsServerTool'
      - $ref: '#/components/schemas/SubagentServerTool_OpenRouter'
      - $ref: '#/components/schemas/WebFetchServerTool'
      - $ref: '#/components/schemas/OpenRouterWebSearchServerTool'
      - $ref: '#/components/schemas/ChatWebSearchShorthand'
      description: Tool definition for function calling (regular function or OpenRouter built-in server tool)
      example:
        function:
          description: Get the current weather for a location
          name: get_weather
          parameters:
            properties:
              location:
                description: City name
                type: string
              unit:
                enum:
                - celsius
                - fahrenheit
                type: string
                x-speakeasy-unknown-values: allow
            required:
            - location
            type: object
        type: function
    ChatJsonSchemaConfig:
      description: JSON Schema configuration object
      example:
        description: A mathematical response
        name: math_response
        schema:
          properties:
            answer:
              type: number
          required:
          - answer
          type: object
        strict: true
      properties:
        description:
          description: Schema description for the model
          example: A mathematical response
          type: string
        name:
          description: Schema name (a-z, A-Z, 0-9, underscores, dashes, max 64 chars)
          example: math_response
          maxLength: 64
          type: string
        schema:
          additionalProperties: {}
          description: JSON Schema object
          example:
            properties:
              answer:
                type: number
            required:
            - answer
            type: object
          type: object
        strict:
          description: Enable strict schema adherence
          example: false
          type:
          - boolean
          - 'null'
      required:
      - name
      type: object
    ChatMessages:
      description: Chat completion message with role-based discrimination
      discriminator:
        mapping:
          assistant: '#/components/schemas/ChatAssistantMessage'
          developer: '#/components/schemas/ChatDeveloperMessage'
          system: '#/components/schemas/ChatSystemMessage'
          tool: '#/components/schemas/ChatToolMessage'
          user: '#/components/schemas/ChatUserMessage'
        propertyName: role
      example:
        content: What is the capital of France?
        role: user
      oneOf:
      - $ref: '#/components/schemas/ChatSystemMessage'
      - $ref: '#/components/schemas/ChatUserMessage'
      - $ref: '#/components/schemas/ChatDeveloperMessage'
      - $ref: '#/components/schemas/ChatAssistantMessage'
      - $ref: '#/components/schemas/ChatToolMessage'
    ChatModelNames:
      description: Models to use for completion
      example:
      - openai/gpt-4
      - openai/gpt-4o
      items:
        allOf:
        - $ref: '#/components/schemas/ModelName'
        - description: Available OpenRouter chat completion models
      type: array
    ChatNamedToolChoice:
      description: Named tool choice for specific function
      example:
        function:
          name: get_weather
        type: function
      properties:
        function:
          properties:
            name:
              description: Function name to call
              example: get_weather
              type: string
          required:
          - name
          type: object
        type:
          enum:
          - function
          type: string
      required:
      - type
      - function
      type: object
    ChatReasoningDetails:
      description: Reasoning details for extended thinking models
      example:
      - text: Let me work through this step by step...
        type: reasoning.text
      items:
        $ref: '#/components/schemas/ReasoningDetailUnion'
      type: array
    ChatReasoningSummaryVerbosityEnum:
      enum:
      - auto
      - concise
      - detailed
      - null
      example: concise
      type:
      - string
      - 'null'
      x-speakeasy-unknown-values: allow
    ChatRequest:
      description: Chat completion request parameters
      example:
        max_tokens: 150
        messages:
        - content: You are a helpful assistant.
          role: system
        - content: What is the capital of France?
          role: user
        model: openai/gpt-4
        temperature: 0.7
      properties:
        cache_control:
          $ref: '#/components/schemas/AnthropicCacheControlDirective'
        debug:
          $ref: '#/components/schemas/ChatDebugOptions'
        frequency_penalty:
          description: Frequency penalty (-2.0 to 2.0)
          example: 0
          format: double
          type:
          - number
          - 'null'
        image_config:
          $ref: '#/components/schemas/ImageConfig'
        logit_bias:
          additionalProperties:
            format: double
            type: number
          description: Token logit bias adjustments
          example:
            '50256': -100
          type:
          - object
          - 'null'
        logprobs:
          description: Return log probabilities
          example: false
          type:
          - boolean
          - 'null'
        max_completion_tokens:
          description: Maximum tokens in completion
          example: 100
          type:
          - integer
          - 'null'
        max_tokens:
          description: 'Maximum tokens (deprecated, use max_completion_tokens). Note: some providers enforce a minimum of 16.'
          example: 100
          type:
          - integer
          - 'null'
        messages:
          description: List of messages for the conversation
          example:
          - content: Hello!
            role: user
          items:
            $ref: '#/components/schemas/ChatMessages'
          minItems: 1
          type: array
        metadata:
          additionalProperties:
            type: string
          description: Key-value pairs for additional object information (max 16 pairs, 64 char keys, 512 char values)
          example:
            session_id: session-456
            user_id: user-123
          type: object
        min_p:
          description: Minimum probability threshold relative to the most likely token. Tokens with probability below min_p * (probability of top token) are filtered out. Not all providers support this parameter.
          example: 0.1
          format: double
          type:
          - number
          - 'null'
        modalities:
          description: Output modalities for the response. Supported values are "text", "image", and "audio".
          example:
          - text
          - image
          items:
            enum:
            - text
            - image
            - audio
            type: string
            x-speakeasy-unknown-values: allow
          type: array
        model:
          $ref: '#/components/schemas/ModelName'
        models:
          $ref: '#/components/schemas/ChatModelNames'
        parallel_tool_calls:
          description: Whether to enable parallel function calling during tool use. When true, the model may generate multiple tool calls in a single response.
          example: true
          type:
          - boolean
          - 'null'
        plugins:
          description: Plugins you want to enable for this request, including their settings.
          items:
            discriminator:
              mapping:
                auto-beta-router: '#/components/schemas/AutoBetaRouterPlugin'
                auto-router: '#/components/schemas/AutoRouterPlugin'
                context-compression: '#/components/schemas/ContextCompressionPlugin'
                file-parser: '#/components/schemas/FileParserPlugin'
                fusion: '#/components/schemas/FusionPlugin'
                moderation: '#/components/schemas/ModerationPlugin'
                pareto-router: '#/components/schemas/ParetoRouterPlugin'
                response-healing: '#/components/schemas/ResponseHealingPlugin'
                web: '#/components/schemas/WebSearchPlugin'
                web-fetch: '#/components/schemas/WebFetchPlugin'
              propertyName: id
            oneOf:
            - $ref: '#/components/schemas/AutoRouterPlugin'
            - $ref: '#/components/schemas/AutoBetaRouterPlugin'
            - $ref: '#/components/schemas/ModerationPlugin'
            - $ref: '#/components/schemas/WebSearchPlugin'
            - $ref: '#/components/schemas/WebFetchPlugin'
            - $ref: '#/components/schemas/FileParserPlugin'
            - $ref: '#/components/schemas/ResponseHealingPlugin'
            - $ref: '#/components/schemas/ContextCompressionPlugin'
            - $ref: '#/components/schemas/ParetoRouterPlugin'
            - $ref: '#/components/schemas/FusionPlugin'
          type: array
        prediction:
          $ref: '#/components/schemas/Prediction'
        presence_penalty:
          description: Presence penalty (-2.0 to 2.0)
          example: 0
          format: double
          type:
          - number
          - 'null'
        prompt_cache_key:
          type:
          - string
          - 'null'
        prompt_cache_options:
          $ref: '#/components/schemas/PromptCacheOptions'
        provider:
          $ref: '#/components/schemas/ProviderPreferences'
        reasoning:
          description: Configuration options for reasoning models
          example:
            effort: medium
            summary: concise
          properties:
            effort:
              description: Constrains effort on reasoning for reasoning models
              enum:
              - max
              - xhigh
              - high
              - medium
              - low
              - minimal
              - none
              - null
              example: medium
              type:
              - string
              - 'null'
              x-speakeasy-unknown-values: allow
            summary:
              $ref: '#/components/schemas/ChatReasoningSummaryVerbosityEnum'
          type: object
        reasoning_effort:
          description: Shorthand for setting reasoning effort. Equivalent to setting reasoning.effort. Cannot be used simultaneously with reasoning.effort if they differ.
          enum:
          - max
          - xhigh
          - high
          - medium
          - low
          - minimal
          - none
          - null
          example: medium
          type:
          - string
          - 'null'
          x-speakeasy-unknown-values: allow
        repetition_penalty:
          description: Penalizes tokens based on how much they have already appeared in the text. A value of 1.0 means no penalty. Values above 1.0 penalize repeated tokens more strongly. Not all providers support this parameter.
          example: 1
          format: double
          type:
          - number
          - 'null'
        response_format:
          description: Response format configuration
          discriminator:
            mapping:
              grammar: '#/components/schemas/ChatFormatGrammarConfig'
              json_object: '#/components/schemas/ChatFormatJsonObjectConfig'
              json_schema: '#/components/schemas/ChatFormatJsonSchemaConfig'
              python: '#/components/schemas/ChatFormatPythonConfig'
              text: '#/components/schemas/ChatFormatTextConfig'
            propertyName: type
          example:
            type: json_object
          oneOf:
          - $ref: '#/components/schemas/ChatFormatTextConfig'
          - $ref: '#/components/schemas/ChatFormatJsonObjectConfig'
          - $ref: '#/components/schemas/ChatFormatJsonSchemaConfig'
          - $ref: '#/components/schemas/ChatFormatGrammarConfig'
          - $ref: '#/components/schemas/ChatFormatPythonConfig'
        route:
          $ref: '#/components/schemas/DeprecatedRoute'
        seed:
          description: Random seed for deterministic outputs
          example: 42
          type:
          - integer
          - 'null'
        service_tier:
          description: The service tier to use for processing this request. `fast` is accepted as an alias for `priority`.
          enum:
          - auto
          - default
          - fast
          - flex
          - priority
          - scale
          - null
          example: auto
          type:
          - string
          - 'null'
          x-speakeasy-unknown-values: allow
        session_id:
          description: A unique identifier for grouping related requests (e.g., a conversation or agent workflow). When provided, OpenRouter uses it as the sticky routing key, routing all requests in the session to the same provider to maximize prompt cache hits. Also used for observability grouping. If provided in both the request body and the x-session-id header, the body value takes precedence. Maximum of 256 characters.
          maxLength: 256
          type: string
        stop:
          anyOf:
          - type: string
          - items:
              type: string
            maxItems: 4
            type: array
          - type: 'null'
          description: Stop sequences (up to 4)
          example:
          - |2+

        stop_server_tools_when:
          $ref: '#/components/schemas/StopServerToolsWhen'
        stream:
          default: false
          description: Enable streaming response
          example: false
          type: boolean
        stream_options:
          $ref: '#/components/schemas/ChatStreamOptions'
        temperature:
          description: Sampling temperature (0-2)
          example: 0.7
          format: double
          type:
          - number
          - 'null'
        tool_choice:
          $ref: '#/components/schemas/ChatToolChoice'
        tools:
          description: Available tools for function calling
          example:
          - function:
              description: Get weather
              name: get_weather
            type: function
          items:
            $ref: '#/components/schemas/ChatFunctionTool'
          type: array
        top_a:
          description: Consider only tokens with "sufficiently high" probabilities based on the probability of the most likely token. Not all providers support this parameter.
          example: 0
          format: double
          type:
          - number
          - 'null'
        top_k:
          description: Limits the model to choose from the top K most likely tokens at each step. A value of 1 means the model will always pick the most likely next token. Not all providers support this parameter.
          example: 40
          type:
          - integer
          - 'null'
        top_logprobs:
          description: Number of top log probabilities to return (0-20)
          example: 5
          type:
          - integer
          - 'null'
        top_p:
          description: Nucleus sampling parameter (0-1)
          example: 1
          format: double
          type:
          - number
          - 'null'
        trace:
          $ref: '#/components/schemas/TraceConfig'
        user:
          description: Per-end-user identifier for abuse isolation. Use a stable ID, hash, or pseudonym. When a provider requires a user identity, OpenRouter folds it into the hashed identity sent upstream and never forwards it raw. If omitted, requests use an account-level identity, so provider policy blocks can affect the whole account.
          example: user-123
          type: string
      required:
      - messages
      type: object
    ChatResult:
      description: Chat completion response
      example:
        choices:
        - finish_reason: stop
          index: 0
          message:
            content: The capital of France is Paris.
            role: assistant
        created: 1677652288
        id: chatcmpl-123
        model: openai/gpt-4
        object: chat.completion
        system_fingerprint: fp_44709d6fcb
        usage:
          completion_tokens: 15
          prompt_tokens: 10
          total_tokens: 25
      properties:
        choices:
          description: List of completion choices
          items:
            $ref: '#/components/schemas/ChatChoice'
          type: array
        created:
          description: Unix timestamp of creation
          example: 1677652288
          type: integer
        id:
          description: Unique completion identifier
          example: chatcmpl-123
          type: string
        model:
          description: Model used for completion
          example: openai/gpt-4
          type: string
        object:
          enum:
          - chat.completion
          type: string
        openrouter_metadata:
          $ref: '#/components/schemas/OpenRouterMetadata'
        service_tier:
          description: The service tier used by the upstream provider for this request
          example: default
          type:
          - string
          - 'null'
        system_fingerprint:
          description: System fingerprint
          example: fp_44709d6fcb
          type:
          - string
          - 'null'
        usage:
