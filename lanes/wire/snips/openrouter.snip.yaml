        parameters:
          $ref: '#/components/schemas/WebSearchConfig'
        search_context_size:
          $ref: '#/components/schemas/SearchQualityLevel'
        type:
          enum:
          - web_search
          - web_search_preview
          - web_search_preview_2025_03_11
          - web_search_2025_08_26
          type: string
          x-speakeasy-unknown-values: allow
