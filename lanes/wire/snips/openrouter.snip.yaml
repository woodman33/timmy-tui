          properties:
            options:
              $ref: '#/components/schemas/ProviderOptions'
          type: object
        response_format:
          description: Output format. "json" (default) returns { text, usage }. "verbose_json" additionally returns task, language, duration, and segment-level timestamps; only supported by OpenAI-compatible providers.
          enum:
          - json
          - verbose_json
          example: json
          type: string
          x-speakeasy-unknown-values: allow
        temperature:
          description: Sampling temperature for transcription
          example: 0
          format: double
          type: number
        timestamp_granularities:
          description: Timestamp detail levels to include when response_format is "verbose_json". "segment" returns segment-level timestamps; "word" additionally returns word-level timestamps in the words array. Ignored unless response_format is "verbose_json".
          example:
          - segment
          items:
            $ref: '#/components/schemas/STTTimestampGranularity'
          type: array
      required:
      - model
      - input_audio
      type: object
    STTResponse:
      description: STT response containing transcribed text and optional usage statistics
      example:
        text: Hello, this is a test of OpenAI speech-to-text transcription.
        usage:
          cost: 0.000508
          input_tokens: 83
          output_tokens: 30
          seconds: 9.2
          total_tokens: 113
      properties:
        duration:
          description: Duration of the input audio in seconds, present when response_format is verbose_json
          example: 9.2
          format: double
          type: number
        language:
          description: Detected or forced language, present when response_format is verbose_json
          example: english
          type: string
        segments:
          description: Timestamped transcript segments, present when response_format is verbose_json
          items:
            $ref: '#/components/schemas/STTSegment'
          type: array
        task:
          description: The task performed, present when response_format is verbose_json
          example: transcribe
          type: string
        text:
          description: The transcribed text
          example: Hello, this is a test of OpenAI speech-to-text transcription. The weather is sunny today and the temperature is around 72 degrees.
          type: string
        usage:
          $ref: '#/components/schemas/STTUsage'
        words:
          description: Timestamped words, present when the provider returns word-level timestamps
          items:
            $ref: '#/components/schemas/STTWord'
          type: array
      required:
      - text
      type: object
    STTSegment:
      description: A timestamped transcript segment, returned when response_format is verbose_json
      example:
        avg_logprob: -0.28
        compression_ratio: 1.13
        end: 3.2
        id: 0
        no_speech_prob: 0.01
        seek: 0
        speaker: 0
        start: 0
        temperature: 0
        text: Hello there.
        tokens:
        - 50364
        - 2425
        - 456
      properties:
        avg_logprob:
          description: Average log probability of the segment
          format: double
          type: number
        compression_ratio:
          description: Compression ratio of the segment
          format: double
          type: number
        end:
          description: Segment end time in seconds
          example: 3.2
          format: double
          type: number
        id:
          description: Segment index within the transcript
          example: 0
          type: integer
        no_speech_prob:
          description: Probability the segment contains no speech
          format: double
          type: number
        seek:
          description: Seek offset of the segment
          example: 0
          type: integer
        speaker:
          description: Speaker index for the segment, present when the provider returns diarization data
          example: 0
          type: integer
        start:
          description: Segment start time in seconds
          example: 0
          format: double
          type: number
        temperature:
          description: Temperature used for the segment
          format: double
          type: number
        text:
          description: Transcribed text of the segment
          example: Hello there.
          type: string
        tokens:
          description: Token IDs of the segment
          items:
            type: integer
          type: array
      required:
      - id
      - start
      - end
      - text
      type: object
    STTTimestampGranularity:
      description: A timestamp detail level for verbose_json transcription responses.
      enum:
      - word
      - segment
      example: word
      type: string
      x-speakeasy-unknown-values: allow
    STTUsage:
      description: Aggregated usage statistics for the request
      example:
        cost: 0.000508
        input_tokens: 83
        output_tokens: 30
        seconds: 9.2
        total_tokens: 113
      properties:
        cost:
          description: Total cost of the request in USD
          example: 0.000508
          format: double
          type: number
        input_tokens:
          description: Number of input tokens billed for this request
          example: 83
          type: integer
        output_tokens:
          description: Number of output tokens generated
          example: 30
          type: integer
        seconds:
          description: Duration of the input audio in seconds
          example: 9.2
          format: double
          type: number
        total_tokens:
          description: Total number of tokens used (input + output)
          example: 113
          type: integer
      type: object
    STTWord:
      description: A timestamped word, returned when the provider includes word-level timestamps
      example:
        end: 0.4
        speaker: 0
        start: 0
        word: Hello
      properties:
        end:
          description: Word end time in seconds
          example: 0.4
          format: double
          type: number
        speaker:
          description: Speaker index for the word, present when the provider returns diarization data
          example: 0
          type: integer
        start:
          description: Word start time in seconds
          example: 0
          format: double
          type: number
        word:
          description: The transcribed word
          example: Hello
          type: string
      required:
      - word
      - start
      - end
      type: object
    SandboxSleepAfterSeconds:
      description: 'How long (in seconds) the container stays warm after its last command before sleeping, freeing its capacity slot. Idle-based: each command renews the timer. Defaults to 300 (5 minutes); capped at 14400 (4 hours).'
      example: 300
      type: integer
    SearchModelsServerToolConfig:
      description: Configuration for the openrouter:experimental__search_models server tool
      example:
        max_results: 5
      properties:
        max_results:
          description: Maximum number of models to return. Defaults to 5, max 20.
          example: 5
          type: integer
      type: object
    SearchQualityLevel:
      description: How much context to retrieve per result. Applies to Exa, Parallel, and Perplexity engines; ignored with native provider search and Firecrawl. For Exa, pins a fixed per-result character cap (low=5,000, medium=15,000, high=30,000); when omitted, Exa picks an adaptive size per query and document (typically ~2,000–4,000 characters per result). For Parallel, controls the total characters across all results; when omitted, Parallel uses its own default size. For Perplexity, maps directly to the Search API's native search_context_size parameter. Overridden by `max_characters` when both are set.
      enum:
      - low
      - medium
      - high
      example: medium
      type: string
      x-speakeasy-unknown-values: allow
    ServerToolUseDetails:
      description: Usage for server-side tool execution (e.g., web search)
      example:
        tool_calls_executed: 2
        tool_calls_requested: 2
        web_search_requests: 2
      properties:
        tool_calls_executed:
          description: Number of OpenRouter server tool calls that executed and produced a result.
          type:
          - integer
          - 'null'
        tool_calls_requested:
          description: Total number of OpenRouter server-orchestrated tool calls the model requested, across all tool types. Provider-native tools (e.g. native web search) are not counted here.
          type:
          - integer
          - 'null'
        web_search_requests:
          description: Number of web searches performed by server-side tools. For server-orchestrated tool calls a web search is also counted in tool_calls_requested; provider-native web search may report web_search_requests only. Do not sum the two.
          type:
          - integer
          - 'null'
      type:
      - object
      - 'null'
    ServiceUnavailableResponse:
