    ProviderPreferences:
      additionalProperties: false
      description: When multiple model providers are available, optionally indicate your routing preference.
      example:
        allow_fallbacks: true
      properties:
        allow_fallbacks:
          description: |
            Whether to allow backup providers to serve requests
            - true: (default) when the primary provider (or your custom providers in "order") is unavailable, use the next best provider.
            - false: use only the primary/custom provider, and return the upstream error if it's unavailable.
          type:
          - boolean
          - 'null'
        data_collection:
          description: |-
            Data collection setting. If no available model provider meets the requirement, your request will return an error.
            - allow: (default) allow providers which store user data non-transiently and may train on it

            - deny: use only providers which do not collect user data.
          enum:
          - deny
          - allow
          - null
          example: allow
          type:
          - string
          - 'null'
          x-speakeasy-unknown-values: allow
        enforce_distillable_text:
          description: Whether to restrict routing to only models that allow text distillation. When true, only models where the author has allowed distillation will be used.
          example: true
          type:
          - boolean
          - 'null'
        ignore:
          description: List of provider slugs to ignore. If provided, this list is merged with your account-wide ignored provider settings for this request.
          example:
          - openai
          - anthropic
          items:
            anyOf:
            - $ref: '#/components/schemas/ProviderName'
            - type: string
          type:
          - array
          - 'null'
        max_price:
          description: The object specifying the maximum price you want to pay for this request. USD price per million tokens, for prompt and completion.
          properties:
            audio:
              description: Maximum price in USD per audio unit
              type: string
            completion:
              description: Maximum price in USD per million completion tokens
              type: string
            image:
              description: Maximum price in USD per image
              type: string
            prompt:
              description: Maximum price in USD per million prompt tokens
              type: string
            request:
              description: Maximum price in USD per request
              type: string
          type: object
        only:
          description: List of provider slugs to allow. If provided, this list is merged with your account-wide allowed provider settings for this request.
          example:
          - openai
          - anthropic
          items:
            anyOf:
            - $ref: '#/components/schemas/ProviderName'
            - type: string
          type:
          - array
          - 'null'
        order:
          description: An ordered list of provider slugs. The router will attempt to use the first provider in the subset of this list that supports your requested model, and fall back to the next if it is unavailable. If no providers are available, the request will fail with an error message.
          example:
          - openai
          - anthropic
          items:
            anyOf:
            - $ref: '#/components/schemas/ProviderName'
            - type: string
          type:
          - array
          - 'null'
        preferred_max_latency:
          $ref: '#/components/schemas/PreferredMaxLatency'
        preferred_min_throughput:
          $ref: '#/components/schemas/PreferredMinThroughput'
        quantizations:
          description: A list of quantization levels to filter the provider by.
          items:
            $ref: '#/components/schemas/Quantization'
          type:
          - array
          - 'null'
        require_parameters:
          description: Whether to filter providers to only those that support the parameters you've provided. If this setting is omitted or set to false, then providers will receive only the parameters they support, and ignore the rest.
          type:
          - boolean
          - 'null'
        sort:
          anyOf:
          - $ref: '#/components/schemas/ProviderSort'
          - $ref: '#/components/schemas/ProviderSortConfig'
          - type: 'null'
          description: The sorting strategy to use for this request, if "order" is not specified. When set, no load balancing is performed.
          example: price
        zdr:
          description: Whether to restrict routing to only ZDR (Zero Data Retention) endpoints. When true, only endpoints that do not retain prompts will be used.
          example: true
          type:
          - boolean
          - 'null'
      type:
      - object
      - 'null'
    ProviderSort:
      description: The provider sorting strategy (price, throughput, latency)
      enum:
      - price
      - throughput
      - latency
      - exacto
      example: price
      type: string
      x-speakeasy-unknown-values: allow
    ProviderSortConfig:
      description: The provider sorting strategy (price, throughput, latency)
      example:
        by: price
        partition: model
      properties:
        by:
          description: The provider sorting strategy (price, throughput, latency)
          enum:
          - price
          - throughput
          - latency
          - exacto
          - null
          example: price
          type:
          - string
          - 'null'
          x-speakeasy-unknown-values: allow
        partition:
          description: 'Partitioning strategy for sorting: "model" (default) groups endpoints by model before sorting (fallback models remain fallbacks), "none" sorts all endpoints together regardless of model.'
          enum:
          - model
          - none
          - null
          example: model
          type:
          - string
          - 'null'
          x-speakeasy-unknown-values: allow
      type: object
    PublicPricing:
      description: Pricing information for the model
      example:
        completion: '0.00006'
        image: '0'
        prompt: '0.00003'
        request: '0'
      properties:
        audio:
          description: Price in USD per audio input token
          type: string
        audio_output:
          description: Price in USD per audio output token
          type: string
        completion:
          description: Price in USD per token for completion (output) generation
          type: string
        discount:
          description: Fractional discount applied to this endpoint's pricing; the price is multiplied by (1 - discount) (0 = no discount, 1 = free)
          format: double
          type: number
        image:
          description: Price in USD per input image
          type: string
        image_output:
          description: Price in USD per output image
          type: string
        image_token:
          description: Price in USD per image token
          type: string
        input_audio_cache:
          description: Price in USD per cached audio input token
          type: string
        input_cache_read:
          description: Price in USD per cached input token (read)
          type: string
        input_cache_write:
          description: Price per cache-write token, in USD per token. For providers with multiple cache TTLs (e.g. Anthropic), this is the default (5-minute) cache-write rate.
          type: string
        input_cache_write_1h:
          description: Price per 1-hour cache-write token, in USD per token. Only present for providers that price an extended (1-hour) cache TTL separately, such as Anthropic.
          type: string
        internal_reasoning:
          description: Price in USD per internal reasoning token
          type: string
        overrides:
          description: Conditional overrides of the base pricing (e.g. long-context or time-based pricing). An entry applies when all of its condition fields (e.g. min_prompt_tokens, or the utc_start/utc_end time window) match the request; among applicable entries, later entries win per key; price keys absent from an entry inherit the base price. The top-level pricing keys always reflect the price that applies under default conditions.
          items:
            $ref: '#/components/schemas/PricingOverride'
          type: array
        prompt:
          description: Price in USD per token for prompt (input) processing
          type: string
        request:
          description: Price in USD per request
          type: string
        web_search:
          description: Price in USD per web search
          type: string
      required:
      - prompt
      - completion
      type: object
    Quantization:
      enum:
      - int4
      - int8
      - fp4
      - mxfp4
      - nvfp4
      - fp6
      - fp8
      - mxfp8
      - fp16
      - bf16
      - fp32
      - unknown
      example: fp16
      type: string
      x-speakeasy-unknown-values: allow
    RankingsDailyMeta:
      example:
        as_of: 2026-05-12T02:00:00.000Z
        end_date: 2026-05-11
        start_date: 2026-04-12
        version: v1
      properties:
        as_of:
          description: ISO-8601 timestamp of when the response was generated. Reflects data-freshness because the underlying materialized view continuously ingests upstream events.
          example: 2026-05-12T02:00:00.000Z
          type: string
        end_date:
          description: Resolved end of the date window (UTC, inclusive).
          example: 2026-05-11
          type: string
        start_date:
          description: Resolved start of the date window (UTC, inclusive).
          example: 2026-04-12
          type: string
        version:
          description: Dataset version. Field names and grain are stable for the life of `v1`.
          enum:
          - v1
          type: string
      required:
      - as_of
      - version
      - start_date
      - end_date
      type: object
