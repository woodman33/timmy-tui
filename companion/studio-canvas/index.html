<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timmy Canvas</title>
<link rel="icon" href="data:," />
<!-- tldraw, React and tldraw's fonts and icons, bundled on this machine by scripts/canvas/build.mjs. -->
<link rel="stylesheet" href="dist/canvas.css" />
<style>
  html, body, #root { margin: 0; height: 100%; }
  body { background: #0a0e12; color: #e6edf3; font: 12px ui-monospace, Menlo, monospace; }
  /* Top centre: tldraw's own panels hold the corners and the bottom edge. */
  #status { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 400; padding: 4px 10px; border-radius: 6px;
    max-width: calc(100vw - 32px); box-sizing: border-box; background: #101418; border: 1px solid #2d333b; color: #e6edf3; }
  #status[data-kind="error"] { border-color: #f85149; }
</style>
</head>
<body>
<div id="root"></div>
<div id="status" role="status" data-kind="loading">Loading the canvas</div>
<script type="module" src="dist/canvas.js" onerror="var s=document.getElementById('status');s.dataset.kind='error';s.textContent='The canvas code did not load (dist/canvas.js). In the Timmy checkout run: npm run build:canvas, then reload.'"></script>
</body>
</html>
